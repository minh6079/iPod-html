<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Powder Simulation – Metal + Stone + Sand + Water</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      display: block;
      background: black;
    }

    button {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #444;
    }

    #metalBtn.active { background: #32A956; color: #000; }
    #stoneBtn.active { background: #32A956; color: #000; }
    #sandBtn.active { background: #32A956; color: #000; }
    #waterBtn.active { background: #32A956; color: #000; }

    #metalBtn { bottom: 170px; background: #666; color: #000; }
    #stoneBtn { bottom: 130px; background: #666; color: #000; }
    #sandBtn { bottom: 90px; background: #666; color: #000; }
    #waterBtn { bottom: 50px; background: #666; color: #000; }
    #resetBtn { bottom: 10px; background: #222; color: #fff; }
    #metalBtn:active, #stoneBtn:active, #sandBtn:active, #waterBtn:active, #resetBtn:active { background: #555; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <button id="metalBtn">Metal</button>
  <button id="stoneBtn">Stone</button>
  <button id="sandBtn">Sand</button>
  <button id="waterBtn">Water</button>
  <button id="resetBtn">Reset</button>

  <script>
"use strict";

var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');
var metalBtn = document.getElementById('metalBtn');
var stoneBtn = document.getElementById('stoneBtn');
var sandBtn = document.getElementById('sandBtn');
var waterBtn = document.getElementById('waterBtn');
var resetBtn = document.getElementById('resetBtn');
var pixelSize = 10;
var metalActive = false,
  stoneActive = false,
  sandActive = false,
  waterActive = false;
var cols, rows;
var grid = [];
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  cols = Math.floor(canvas.width / pixelSize);
  rows = Math.floor(canvas.height / pixelSize);
  grid = [];
  for (var y = 0; y < rows; y++) {
    grid[y] = [];
    for (var x = 0; x < cols; x++) grid[y][x] = 0;
  }
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize, false);
resize();
function clearActive() {
  metalBtn.className = '';
  stoneBtn.className = '';
  sandBtn.className = '';
  waterBtn.className = '';
}
metalBtn.onclick = function () {
  metalActive = !metalActive;
  stoneActive = sandActive = waterActive = false;
  clearActive();
  if (metalActive) metalBtn.className = 'active';
};
stoneBtn.onclick = function () {
  stoneActive = !stoneActive;
  metalActive = sandActive = waterActive = false;
  clearActive();
  if (stoneActive) stoneBtn.className = 'active';
};
sandBtn.onclick = function () {
  sandActive = !sandActive;
  metalActive = stoneActive = waterActive = false;
  clearActive();
  if (sandActive) sandBtn.className = 'active';
};
waterBtn.onclick = function () {
  waterActive = !waterActive;
  metalActive = stoneActive = sandActive = false;
  clearActive();
  if (waterActive) waterBtn.className = 'active';
};
resetBtn.onclick = function () {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  metalActive = stoneActive = sandActive = waterActive = false;
  clearActive();
  for (var y = 0; y < rows; y++) {
    for (var x = 0; x < cols; x++) grid[y][x] = 0;
  }
};
function drawPixel(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
}
function placeElement(mouseX, mouseY) {
  var x = Math.floor(mouseX / pixelSize),
    y = Math.floor(mouseY / pixelSize);
  if (x < 0 || x >= cols || y < 0 || y >= rows) return;
  if (grid[y][x] !== 0) return;
  if (metalActive) {
    grid[y][x] = 1;
    drawPixel(x, y, '#fff');
  } else if (stoneActive) {
    grid[y][x] = 2;
    drawPixel(x, y, '#888');
  } else if (sandActive) {
    grid[y][x] = 3;
    drawPixel(x, y, '#f1c406');
  } else if (waterActive) {
    grid[y][x] = 4;
    drawPixel(x, y, '#3498db');
  }
}
var drawing = false;
canvas.addEventListener('mousedown', function (e) {
  drawing = true;
  placeElement(e.clientX, e.clientY);
}, false);
canvas.addEventListener('mousemove', function (e) {
  if (drawing) placeElement(e.clientX, e.clientY);
}, false);
canvas.addEventListener('mouseup', function () {
  drawing = false;
}, false);
canvas.addEventListener('mouseleave', function () {
  drawing = false;
}, false);
canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  drawing = true;
  for (var i = 0; i < e.touches.length; i++) placeElement(e.touches[i].clientX, e.touches[i].clientY);
}, false);
canvas.addEventListener('touchmove', function (e) {
  e.preventDefault();
  if (drawing) {
    for (var i = 0; i < e.touches.length; i++) placeElement(e.touches[i].clientX, e.touches[i].clientY);
  }
}, false);
canvas.addEventListener('touchend', function (e) {
  drawing = false;
}, false);
canvas.addEventListener('touchcancel', function (e) {
  drawing = false;
}, false);
function update() {
  for (var y = rows - 2; y >= 0; y--) {
    for (var x = 0; x < cols; x++) {
      if (grid[y][x] === 2) {
        // stone
        if (y + 1 < rows && grid[y + 1][x] === 0) {
          grid[y + 1][x] = 2;
          grid[y][x] = 0;
          drawPixel(x, y, '#000');
          drawPixel(x, y + 1, '#888');
        }
      } else if (grid[y][x] === 3) {
        // sand
        if (y + 1 < rows && grid[y + 1][x] === 0) {
          grid[y + 1][x] = 3;
          grid[y][x] = 0;
          drawPixel(x, y, '#000');
          drawPixel(x, y + 1, '#CBBD93');
        } else if (y + 1 < rows && x - 1 >= 0 && grid[y + 1][x - 1] === 0) {
          grid[y + 1][x - 1] = 3;
          grid[y][x] = 0;
          drawPixel(x, y, '#000');
          drawPixel(x - 1, y + 1, '#CBBD93');
        } else if (y + 1 < rows && x + 1 < cols && grid[y + 1][x + 1] === 0) {
          grid[y + 1][x + 1] = 3;
          grid[y][x] = 0;
          drawPixel(x, y, '#000');
          drawPixel(x + 1, y + 1, '#CBBD93');
        }
      } else if (grid[y][x] === 4) {
        // water
        if (y + 1 < rows && grid[y + 1][x] === 0) {
          grid[y + 1][x] = 4;
          grid[y][x] = 0;
          drawPixel(x, y, '#000');
          drawPixel(x, y + 1, '#3498db');
        } else if (y + 1 < rows && x - 1 >= 0 && grid[y + 1][x - 1] === 0) {
          grid[y + 1][x - 1] = 4;
          grid[y][x] = 0;
          drawPixel(x, y, '#000');
          drawPixel(x - 1, y + 1, '#3498db');
        } else if (y + 1 < rows && x + 1 < cols && grid[y + 1][x + 1] === 0) {
          grid[y + 1][x + 1] = 4;
          grid[y][x] = 0;
          drawPixel(x, y, '#000');
          drawPixel(x + 1, y + 1, '#3498db');
        } else {
          // random left/right
          var dir = Math.random() < 0.5 ? -1 : 1;
          if (x + dir >= 0 && x + dir < cols && grid[y][x + dir] === 0) {
            grid[y][x + dir] = 4;
            grid[y][x] = 0;
            drawPixel(x, y, '#000');
            drawPixel(x + dir, y, '#3498db');
          }
        }
      }
    }
  }
  requestAnimationFrame(update);
}
update();
  </script>
</body>
</html>

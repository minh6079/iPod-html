<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Gemini</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #f8f9fa;
            overflow: hidden;
        }
        
        #container {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            height: 100%;
        }
        
        #header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 14px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            -webkit-box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            letter-spacing: 0.5px;
        }
        
        #setup {
            padding: 30px 20px;
            text-align: center;
        }
        
        #setup h2 {
            color: #5f6368;
            font-size: 20px;
            margin-bottom: 8px;
            font-weight: normal;
        }
        
        #setup p {
            color: #80868b;
            font-size: 13px;
            margin-bottom: 24px;
        }
        
        #setup input {
            width: 100%;
            padding: 14px;
            border: 2px solid #dadce0;
            -webkit-border-radius: 8px;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 16px;
            background: #fff;
        }
        
        #setup input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        #setup button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            -webkit-border-radius: 8px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            -webkit-box-shadow: 0 2px 6px rgba(102,126,234,0.4);
        }
        
        #messages {
            -webkit-box-flex: 1;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            padding: 16px 12px;
            background: #f8f9fa;
        }
        
        .msg {
            margin-bottom: 16px;
            clear: both;
            -webkit-animation: fadeIn 0.3s ease-in;
        }
        
        @-webkit-keyframes fadeIn {
            from { opacity: 0; -webkit-transform: translateY(10px); }
            to { opacity: 1; -webkit-transform: translateY(0); }
        }
        
        .msg-user {
            text-align: right;
        }
        
        .msg-ai {
            text-align: left;
        }
        
        .bubble {
            display: inline-block;
            max-width: 80%;
            padding: 12px 16px;
            -webkit-border-radius: 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            -webkit-box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .msg-user .bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            -webkit-border-bottom-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }
        
        .msg-ai .bubble {
            background: #fff;
            color: #202124;
            border: 1px solid #e8eaed;
            -webkit-border-bottom-left-radius: 4px;
            border-bottom-left-radius: 4px;
        }
        
        .label {
            font-size: 11px;
            color: #80868b;
            margin-bottom: 4px;
            font-weight: 500;
        }
        
        .msg-user .label {
            text-align: right;
        }
        
        .msg-ai .label {
            text-align: left;
        }
        
        #input-area {
            background: #fff;
            border-top: 1px solid #e8eaed;
            padding: 12px;
            -webkit-box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
        }
        
        #input-container {
            display: -webkit-box;
            -webkit-box-align: center;
            background: #f1f3f4;
            -webkit-border-radius: 24px;
            border-radius: 24px;
            padding: 4px;
        }
        
        #input {
            -webkit-box-flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            font-size: 15px;
            outline: none;
        }
        
        #send {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            -webkit-border-radius: 22px;
            border-radius: 22px;
            font-size: 18px;
            font-weight: bold;
            -webkit-box-shadow: 0 2px 4px rgba(102,126,234,0.3);
        }
        
        #send:disabled {
            background: #dadce0;
            -webkit-box-shadow: none;
        }
        
        .hide {
            display: none !important;
        }
        
        .spinner {
            text-align: left;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        
        .spinner .bubble {
            background: #fff;
            border: 1px solid #e8eaed;
            color: #80868b;
            padding: 12px 16px;
        }
        
        .dots {
            display: inline-block;
        }
        
        .dots span {
            -webkit-animation: blink 1.4s infinite;
            animation: blink 1.4s infinite;
            opacity: 0.3;
        }
        
        .dots span:nth-child(2) {
            -webkit-animation-delay: 0.2s;
            animation-delay: 0.2s;
        }
        
        .dots span:nth-child(3) {
            -webkit-animation-delay: 0.4s;
            animation-delay: 0.4s;
        }
        
        @-webkit-keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        #clear {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255,255,255,0.3);
            color: #fff;
            border: none;
            padding: 6px 12px;
            -webkit-border-radius: 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header" style="position: relative;">
            Gemini
            <button id="clear" class="hide" onclick="clearChat()">Clear</button>
        </div>
        
        <div id="setup">
            <h2>Welcome to Gemini</h2>
            <p>Enter your API key to get started</p>
            <input type="password" id="key" placeholder="Paste your API key here">
            <button onclick="start()">Start Chatting</button>
        </div>
        
        <div id="messages" class="hide"></div>
        
        <div id="input-area" class="hide">
            <div id="input-container">
                <input type="text" id="input" placeholder="Ask me anything...">
                <button id="send" onclick="send()">➤</button>
            </div>
        </div>
    </div>

    <script>
        var key = '';
        var msgs = [];
        
        function start() {
            key = document.getElementById('key').value.replace(/\s/g, '');
            if (!key) {
                alert('Please enter your API key');
                return;
            }
            document.getElementById('setup').className = 'hide';
            document.getElementById('messages').className = '';
            document.getElementById('input-area').className = '';
            document.getElementById('clear').className = '';
            document.getElementById('input').focus();
        }
        
        function add(txt, user) {
            var m = document.getElementById('messages');
            var d = document.createElement('div');
            d.className = 'msg ' + (user ? 'msg-user' : 'msg-ai');
            
            var lbl = document.createElement('div');
            lbl.className = 'label';
            lbl.appendChild(document.createTextNode(user ? 'You' : 'Gemini'));
            d.appendChild(lbl);
            
            var b = document.createElement('div');
            b.className = 'bubble';
            b.appendChild(document.createTextNode(txt));
            d.appendChild(b);
            m.appendChild(d);
            m.scrollTop = m.scrollHeight;
        }
        
        function loading(show) {
            var l = document.getElementById('load');
            if (show) {
                if (!l) {
                    l = document.createElement('div');
                    l.id = 'load';
                    l.className = 'spinner';
                    var lbl = document.createElement('div');
                    lbl.className = 'label';
                    lbl.appendChild(document.createTextNode('Gemini'));
                    l.appendChild(lbl);
                    var b = document.createElement('div');
                    b.className = 'bubble';
                    var dots = document.createElement('div');
                    dots.className = 'dots';
                    for (var i = 0; i < 3; i++) {
                        var s = document.createElement('span');
                        s.appendChild(document.createTextNode('●'));
                        dots.appendChild(s);
                    }
                    b.appendChild(dots);
                    l.appendChild(b);
                    document.getElementById('messages').appendChild(l);
                }
                var m = document.getElementById('messages');
                m.scrollTop = m.scrollHeight;
            } else if (l) {
                l.parentNode.removeChild(l);
            }
        }
        
        function send() {
            var inp = document.getElementById('input');
            var txt = inp.value.replace(/^\s+|\s+$/g, '');
            if (!txt) return;
            
            add(txt, true);
            msgs.push({role: 'user', parts: [{text: txt}]});
            inp.value = '';
            
            var btn = document.getElementById('send');
            btn.disabled = true;
            loading(true);
            
            var x = new XMLHttpRequest();
            x.open('POST', 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + key);
            x.setRequestHeader('Content-Type', 'application/json');
            
            x.onreadystatechange = function() {
                if (x.readyState == 4) {
                    loading(false);
                    btn.disabled = false;
                    
                    if (x.status == 200) {
                        try {
                            var r = JSON.parse(x.responseText);
                            var t = r.candidates[0].content.parts[0].text;
                            add(t, false);
                            msgs.push({role: 'model', parts: [{text: t}]});
                        } catch(e) {
                            add('Error parsing response', false);
                        }
                    } else {
                        add('Error: ' + x.status, false);
                    }
                    inp.focus();
                }
            };
            
            x.send(JSON.stringify({contents: msgs}));
        }
        
        function clearChat() {
            if (confirm('Clear all messages?')) {
                msgs = [];
                document.getElementById('messages').innerHTML = '';
            }
        }
        
        document.getElementById('input').onkeypress = function(e) {
            if (e.keyCode == 13) send();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<body style="margin:0; background:#000; overflow:hidden;">
<canvas id="c"></canvas>
<script>
var c = document.getElementById("c");
var ctx = c.getContext("2d");
c.width = window.innerWidth || 320;
c.height = window.innerHeight || 480;

// Planets
var planets = [];
var score = 0;

function addPlanet() {
    planets.push({ 
        x: c.width/2, 
        y: c.height/2, 
        r: 5, 
        a: Math.random() * 2*Math.PI, 
        s: Math.random() * 0.02 + 0.005 
    });
}

// Initial planets
for (var i=0; i<5; i++) addPlanet();

// Touch input
c.addEventListener("touchstart", function(e){
    e.preventDefault(); // prevent scrolling
    var t = e.touches[0];
    for (var i=0; i<planets.length; i++) {
        var p = planets[i];
        var dx = t.pageX - p.x;
        var dy = t.pageY - p.y;
        if(dx*dx + dy*dy < p.r*p.r*4){
            score++;
            p.r = 0; // remove touched planet
            addPlanet(); // add new planet
        }
    }
}, false);

// Set font for score
ctx.font = "16px Arial";

// Game loop
function loop() {
    // Clear with slight trail
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(0, 0, c.width, c.height);

    // Draw planets
    ctx.fillStyle = "#0f0";
    for(var i=0; i<planets.length; i++){
        var p = planets[i];
        p.a += p.s;
        p.x = c.width/2 + Math.cos(p.a)*100;
        p.y = c.height/2 + Math.sin(p.a)*100;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, 2*Math.PI);
        ctx.fill();
    }

    // Draw score
    ctx.fillStyle = "#fff";
    ctx.fillText("Score: " + score, 10, 20);

    setTimeout(loop, 33); // ~30 FPS
}

loop();
</script>
</body>
</html>

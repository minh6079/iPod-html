<!DOCTYPE html>
<html>
<body style="margin:0; background:#222; overflow:hidden;">
<canvas id="c" style="display:block; border:1px solid #555;"></canvas>
<script>
var c = document.getElementById("c");
var ctx = c.getContext("2d");
c.width = window.innerWidth || 320;
c.height = window.innerHeight || 480;

var draw = false;

// Touch input
c.addEventListener("touchstart", function(e){
    e.preventDefault();
    draw = true;
}, false);

c.addEventListener("touchend", function(e){
    e.preventDefault();
    draw = false;
}, false);

c.addEventListener("touchmove", function(e){
    e.preventDefault(); // prevent scrolling
    if(!draw) return;
    var t = e.touches[0];
    ctx.fillStyle = "#0f0";
    ctx.fillRect(t.pageX, t.pageY, 3, 3);
}, false);

// Optional: prevent pinch zoom
document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, false);
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body style="margin:0; background:#003; overflow:hidden;">
<canvas id="c"></canvas>
<script>
var c = document.getElementById("c");
var ctx = c.getContext("2d");
c.width = window.innerWidth || 320;
c.height = window.innerHeight || 480;

// Fish object
var fish = { x: 50, y: 240, dx: 2 };
var score = 0;

// Touch input
c.addEventListener("touchstart", function(e){
    e.preventDefault(); // prevent scrolling
    var t = e.touches[0];
    var dx = t.pageX - fish.x;
    var dy = t.pageY - fish.y;
    if (dx*dx + dy*dy < 400) {
        score++;
        fish.x = Math.random() * (c.width-40) + 20;
        fish.y = Math.random() * (c.height-40) + 20;
    }
}, false);

// Set font for score
ctx.font = "16px Arial";

// Game loop
function loop() {
    // Clear screen
    ctx.fillStyle = "#003";
    ctx.fillRect(0,0,c.width,c.height);

    // Draw fish
    ctx.fillStyle = "#0ff";
    ctx.beginPath();
    ctx.arc(fish.x, fish.y, 10, 0, Math.PI*2);
    ctx.fill();

    // Move fish horizontally
    fish.x += fish.dx;
    if (fish.x < 10 || fish.x > c.width-10) fish.dx *= -1;

    // Draw score
    ctx.fillStyle = "#fff";
    ctx.fillText("Fish: " + score, 10, 20);

    setTimeout(loop, 33); // ~30 FPS
}
loop();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
html, body { margin:0; padding:0; overflow:hidden; background:#000; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var c = document.getElementById("c"), ctx = c.getContext("2d");
c.width = window.innerWidth || 320;
c.height = window.innerHeight || 480;

var x = 160, y = 200, dx = 2, dy = -2;
var p = 120;
var bricks = [];
for (var i = 0; i < 6; i++) for (var j = 0; j < 3; j++) bricks.push({ x: 20 + i * 50, y: 20 + j * 15, h: false });

// Prevent scrolling
c.addEventListener("touchmove", function(e) {
    e.preventDefault();
    p = e.touches[0].pageX - 40;
}, false);
document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, false);

function loop() {
    ctx.fillStyle = "#000"; 
    ctx.fillRect(0, 0, c.width, c.height);

    // Paddle
    ctx.fillStyle = "#0f0"; 
    ctx.fillRect(p, c.height - 20, 80, 10);

    // Ball
    ctx.beginPath(); 
    ctx.arc(x, y, 5, 0, Math.PI*2); 
    ctx.fill();

    // Bricks
    for (var i = 0; i < bricks.length; i++) {
        var b = bricks[i]; 
        if (!b.h) {
            ctx.fillStyle = "#0f0"; 
            ctx.fillRect(b.x, b.y, 40, 10);
            if (x > b.x && x < b.x + 40 && y < b.y + 10 && y > b.y) { 
                dy = -dy; 
                b.h = true; 
            }
        }
    }

    // Ball movement
    x += dx; 
    y += dy;

    if (x < 5 || x > c.width-5) dx = -dx; 
    if (y < 5) dy = -dy;
    if (y > c.height - 20 && x > p && x < p + 80) dy = -dy;
    if (y > c.height) { x = c.width/2; y = c.height/2; }

    setTimeout(loop, 16);
}
loop();
</script>
</body>
</html>

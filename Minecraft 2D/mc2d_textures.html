<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=320, user-scalable=no">
    <title>2D Minecraft ES5 iPod</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            background: #87CEEB;
            -webkit-image-rendering: optimize-contrast;
            image-rendering: pixelated;
        }

        #ui-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 100;
        }

        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: rgba(0, 0, 0, 0.6);
            white-space: nowrap;
        }

        #inventory {
            pointer-events: auto;
            height: 100%;
            display: inline-block;
            vertical-align: middle;
        }

        .inv-slot {
            display: inline-block;
            width: 28px;
            height: 28px;
            margin: 6px 2px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.5);
            position: relative;
            cursor: pointer;
        }

        .inv-slot.selected {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.3);
        }

        .inv-slot canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .variant-indicator {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            background: rgba(100, 200, 100, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 2px;
            font-size: 10px;
            line-height: 10px;
            text-align: center;
            color: white;
            font-weight: bold;
            pointer-events: auto;
            cursor: pointer;
        }

        .variant-indicator:active {
            background: rgba(120, 220, 120, 1);
        }

        .variant-dropdown {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 5px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 5px;
            padding: 4px;
            display: none;
            z-index: 1000;
            max-width: 100px;
        }

        .inv-slot.show-dropdown .variant-dropdown {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }

        .variant-option {
            width: 28px;
            height: 28px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }

        .variant-option:active {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.3);
        }

        .variant-option canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #mode-indicator {
            position: absolute;
            bottom: 27px;
            left: 57%;
            -webkit-transform: translateX(-50%);
            pointer-events: auto;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        #mode-indicator.mine-mode {
            background: rgba(200, 50, 50, 0.8);
            border-color: #ff6b6b;
        }

        #mode-indicator.place-mode {
            background: rgba(50, 150, 50, 0.8);
            border-color: #6bff6b;
        }

        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0));
            background: -webkit-linear-gradient(bottom, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0));
            pointer-events: none;
        }

        .btn {
            position: absolute;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            font-size: 20px;
            color: white;
            text-align: center;
            font-weight: bold;
            pointer-events: auto;
            cursor: pointer;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.6);
            -webkit-transform: scale(0.95);
        }

        #leftBtn,
        #rightBtn {
            width: 50px;
            height: 50px;
            bottom: 20px;
        }

        #leftBtn {
            left: 10px;
        }

        #rightBtn {
            left: 65px;
        }

        #jumpBtn {
            right: 10px;
            bottom: 20px;
            width: 60px;
            height: 60px;
            font-size: 28px;
            background: rgba(255, 200, 50, 0.4);
            border-color: rgba(255, 220, 100, 0.8);
        }

        #jumpBtn:active {
            background: rgba(255, 220, 100, 0.7);
        }

        #reach-indicator {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 6px;
            height: 6px;
            margin-left: -3px;
            margin-top: -3px;
            pointer-events: none;
        }

        #reach-indicator::before,
        #reach-indicator::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }

        #reach-indicator::before {
            left: 0;
            top: 2px;
            width: 6px;
            height: 2px;
        }

        #reach-indicator::after {
            left: 2px;
            top: 0;
            width: 2px;
            height: 6px;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui-container">
        <div id="top-bar">
            <div id="inventory"></div>
        </div>
        <div id="reach-indicator"></div>
        <div id="controls">
            <div class="btn" id="leftBtn">◄</div>
            <div class="btn" id="rightBtn">►</div>
            <div id="mode-indicator" class="mine-mode">MINE</div>
            <div class="btn" id="jumpBtn">▲</div>
        </div>
    </div>

    <script>
        (function () {
            var canvas = document.getElementById('gameCanvas');
            var ctx = canvas.getContext('2d');
            function resizeCanvas() { canvas.width = 320; canvas.height = 480; }
            resizeCanvas();

            var BLOCK_SIZE = 16, WORLD_WIDTH = 120, WORLD_HEIGHT = 60, GRAVITY = 0.8, JUMP_POWER = -12, MOVE_SPEED = 3, MAX_REACH = 4, MAX_FALL_SPEED = 15;
            var BLOCKS = { 
                AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, WOOD: 4, LEAVES: 5, PLANKS: 6,
                COBBLESTONE: 8, COAL_ORE: 9, IRON_ORE: 10, GOLD_ORE: 11, DIAMOND_ORE: 12,
                MOSSY_COBBLESTONE: 13, OAK_STAIRS_LEFT: 14, OAK_STAIRS_RIGHT: 15, OAK_FENCE: 16, 
                OAK_SLAB: 17, STONE_SLAB: 18, COBBLE_SLAB: 19,
                COAL_BLOCK: 20, IRON_BLOCK: 21, GOLD_BLOCK: 22, DIAMOND_BLOCK: 23
            };

            var TEXTURE_FILES = {
                1: 'textures/grass.png',
                2: 'textures/dirt.png',
                3: 'textures/stone.png',
                4: 'textures/wood.png',
                5: 'textures/leaves.png',
                6: 'textures/planks.png',
                8: 'textures/cobblestone.png',
                9: 'textures/coal_ore.png',
                10: 'textures/iron_ore.png',
                11: 'textures/gold_ore.png',
                12: 'textures/diamond_ore.png',
                13: 'textures/mossy_cobblestone.png',
                14: 'textures/oak_stairs_left.png',
                15: 'textures/oak_stairs_right.png',
                16: 'textures/oak_fence.png',
                17: 'textures/oak_slab.png',
                18: 'textures/stone_slab.png',
                19: 'textures/cobble_slab.png',
                20: 'textures/coal_block.png',
                21: 'textures/iron_block.png',
                22: 'textures/gold_block.png',
                23: 'textures/diamond_block.png'
            };

            var textures = {};
            var texturesLoaded = 0;
            var totalTextures = 22;

            var world = [], player = { x: 60 * BLOCK_SIZE, y: 20 * BLOCK_SIZE, width: 12, height: 24, vx: 0, vy: 0, onGround: false };
            var camera = { x: 0, y: 0 };
            var keys = { left: false, right: false, jump: false, jumpPressed: false };
            var mode = 'mine', selectedBlock = BLOCKS.DIRT, selectedSlot = 0;
            
            var blockVariants = {};
            blockVariants[BLOCKS.COBBLESTONE] = [BLOCKS.COBBLESTONE, BLOCKS.MOSSY_COBBLESTONE, BLOCKS.COBBLE_SLAB];
            blockVariants[BLOCKS.STONE] = [BLOCKS.STONE, BLOCKS.STONE_SLAB];
            blockVariants[BLOCKS.PLANKS] = [BLOCKS.PLANKS, BLOCKS.OAK_SLAB, BLOCKS.OAK_STAIRS_LEFT, BLOCKS.OAK_STAIRS_RIGHT, BLOCKS.OAK_FENCE];
            blockVariants[BLOCKS.COAL_ORE] = [BLOCKS.COAL_ORE, BLOCKS.COAL_BLOCK];
            blockVariants[BLOCKS.IRON_ORE] = [BLOCKS.IRON_ORE, BLOCKS.IRON_BLOCK];
            blockVariants[BLOCKS.GOLD_ORE] = [BLOCKS.GOLD_ORE, BLOCKS.GOLD_BLOCK];
            blockVariants[BLOCKS.DIAMOND_ORE] = [BLOCKS.DIAMOND_ORE, BLOCKS.DIAMOND_BLOCK];
            
            var inventory = [BLOCKS.GRASS, BLOCKS.DIRT, BLOCKS.STONE, BLOCKS.WOOD, BLOCKS.PLANKS, BLOCKS.COBBLESTONE, BLOCKS.COAL_ORE, BLOCKS.IRON_ORE, BLOCKS.GOLD_ORE, BLOCKS.DIAMOND_ORE];

            function loadTextures() {
                for (var blockType in TEXTURE_FILES) {
                    var img = new Image();
                    img.src = TEXTURE_FILES[blockType];
                    img.onload = (function (type) {
                        return function () {
                            textures[type] = this;
                            texturesLoaded++;
                            if (texturesLoaded === totalTextures) {
                                createInventory();
                                gameLoop();
                            }
                        };
                    })(blockType);
                    img.onerror = (function (type) {
                        return function () {
                            console.error('Failed to load texture: ' + TEXTURE_FILES[type]);
                            texturesLoaded++;
                            if (texturesLoaded === totalTextures) {
                                createInventory();
                                gameLoop();
                            }
                        };
                    })(blockType);
                }
            }

            function initWorld() {
                for (var x = 0; x < WORLD_WIDTH; x++) { 
                    world[x] = []; 
                    for (var y = 0; y < WORLD_HEIGHT; y++) { 
                        world[x][y] = BLOCKS.AIR; 
                    } 
                }
                for (var x = 0; x < WORLD_WIDTH; x++) {
                    var height = Math.floor(WORLD_HEIGHT / 2 + Math.sin(x * 0.08) * 6 + Math.cos(x * 0.04) * 4);
                    for (var y = height; y < WORLD_HEIGHT; y++) {
                        if (y === height) {
                            world[x][y] = BLOCKS.GRASS;
                        } else if (y < height + 4) {
                            world[x][y] = BLOCKS.DIRT;
                        } else {
                            world[x][y] = BLOCKS.STONE;

                            var depth = y - (height + 4);

                            if (depth > 2 && Math.random() < 0.08) {
                                world[x][y] = BLOCKS.COAL_ORE;
                            }

                            if (depth > 8 && Math.random() < 0.04) {
                                world[x][y] = BLOCKS.IRON_ORE;
                            }

                            if (depth > 15 && Math.random() < 0.02) {
                                world[x][y] = BLOCKS.GOLD_ORE;
                            }

                            if (depth > 20 && Math.random() < 0.01) {
                                world[x][y] = BLOCKS.DIAMOND_ORE;
                            }
                        }
                    }
                    if (Math.random() < 0.08 && x < WORLD_WIDTH - 4 && x > 3) {
                        var th = 5 + Math.floor(Math.random() * 4); 
                        for (var ty = 0; ty < th; ty++) { 
                            if (height - ty - 1 >= 0) { 
                                world[x][height - ty - 1] = BLOCKS.WOOD; 
                            } 
                        }
                        for (var lx = -2; lx <= 2; lx++) { 
                            for (var ly = -2; ly <= 1; ly++) { 
                                var tx = x + lx; 
                                var ty = height - th + ly; 
                                if (tx >= 0 && tx < WORLD_WIDTH && ty >= 0 && ty < WORLD_HEIGHT) { 
                                    if ((Math.abs(lx) + Math.abs(ly) < 4) && world[tx][ty] === BLOCKS.AIR) { 
                                        world[tx][ty] = BLOCKS.LEAVES; 
                                    } 
                                } 
                            } 
                        }
                    }
                }
            }

            function drawBlock(x, y, t) {
                if (t === BLOCKS.AIR) return;
                var sx = x * BLOCK_SIZE - camera.x;
                var sy = y * BLOCK_SIZE - camera.y;

                if (textures[t]) {
                    ctx.drawImage(textures[t], sx, sy, BLOCK_SIZE, BLOCK_SIZE);
                }
            }

            function checkCollision(x, y, w, h) {
                var left = Math.floor(x / BLOCK_SIZE), right = Math.floor((x + w) / BLOCK_SIZE), top = Math.floor(y / BLOCK_SIZE), bottom = Math.floor((y + h) / BLOCK_SIZE);
                for (var bx = left; bx <= right; bx++) { 
                    for (var by = top; by <= bottom; by++) { 
                        if (bx >= 0 && bx < WORLD_WIDTH && by >= 0 && by < WORLD_HEIGHT) { 
                            if (world[bx][by] !== BLOCKS.AIR) { 
                                return true; 
                            } 
                        } else if (by >= WORLD_HEIGHT) { 
                            return true; 
                        } 
                    } 
                } 
                return false;
            }

            function updatePlayer() {
                if (keys.left) { player.vx = -MOVE_SPEED; } else if (keys.right) { player.vx = MOVE_SPEED; } else { player.vx = 0; }
                if (keys.jump && player.onGround && !keys.jumpPressed) { player.vy = JUMP_POWER; player.onGround = false; keys.jumpPressed = true; }
                if (!keys.jump) { keys.jumpPressed = false; }
                if (!player.onGround) { player.vy += GRAVITY; if (player.vy > MAX_FALL_SPEED) { player.vy = MAX_FALL_SPEED; } } else if (player.vy > 0) { player.vy = 0; }

                var oldX = player.x; player.x += player.vx; if (checkCollision(player.x, player.y, player.width, player.height)) { player.x = oldX; }
                var oldY = player.y; player.y += player.vy; if (checkCollision(player.x, player.y, player.width, player.height)) { player.y = oldY; player.vy = 0; player.onGround = true; } else { player.onGround = false; }
            }

            function updateCamera() {
                var tx = player.x - canvas.width / 2 + player.width / 2; 
                var ty = player.y - canvas.height / 2 + player.height / 2;
                tx = Math.max(0, Math.min(tx, WORLD_WIDTH * BLOCK_SIZE - canvas.width));
                ty = Math.max(0, Math.min(ty, WORLD_HEIGHT * BLOCK_SIZE - canvas.height));
                camera.x += (tx - camera.x) * 0.1; 
                camera.y += (ty - camera.y) * 0.1;
            }

            function drawPlayer() {
                var screenX = Math.floor(player.x - camera.x);
                var screenY = Math.floor(player.y - camera.y);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(screenX - 2, screenY + player.height, player.width + 4, 2);

                ctx.fillStyle = '#3A7BC8';
                ctx.fillRect(screenX + 1, screenY + 9, player.width - 2, 13);

                ctx.fillStyle = '#2C5FA0';
                ctx.fillRect(screenX + player.width - 3, screenY + 9, 2, 13);

                ctx.fillStyle = '#F5D7B8';
                ctx.fillRect(screenX + 2, screenY, player.width - 4, 9);

                ctx.fillStyle = '#D4B798';
                ctx.fillRect(screenX + player.width - 4, screenY, 2, 9);

                ctx.fillStyle = '#000';
                ctx.fillRect(screenX + 4, screenY + 3, 2, 2);
                ctx.fillRect(screenX + 8, screenY + 3, 2, 2);

                ctx.fillStyle = '#1A3E6E';
                ctx.fillRect(screenX + 2, screenY + 22, 4, 4);
                ctx.fillRect(screenX + 8, screenY + 22, 4, 4);

                ctx.fillStyle = '#3A7BC8';
                ctx.fillRect(screenX - 1, screenY + 10, 2, 9);
                ctx.fillRect(screenX + player.width - 1, screenY + 10, 2, 9);
            }

            function render() {
                ctx.fillStyle = '#87CEEB'; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                var startX = Math.max(0, Math.floor(camera.x / BLOCK_SIZE) - 1), 
                    endX = Math.min(WORLD_WIDTH, Math.ceil((camera.x + canvas.width) / BLOCK_SIZE) + 1),
                    startY = Math.max(0, Math.floor(camera.y / BLOCK_SIZE) - 1), 
                    endY = Math.min(WORLD_HEIGHT, Math.ceil((camera.y + canvas.height) / BLOCK_SIZE) + 1);
                for (var x = startX; x < endX; x++) { 
                    for (var y = startY; y < endY; y++) { 
                        drawBlock(x, y, world[x][y]); 
                    } 
                }
                drawPlayer();
            }

            function gameLoop() { 
                updatePlayer(); 
                updateCamera(); 
                render(); 
                setTimeout(gameLoop, 16); 
            }

            function isInReach(wx, wy) { 
                var px = player.x + player.width / 2, py = player.y + player.height / 2, bx = wx * BLOCK_SIZE + BLOCK_SIZE / 2, by = wy * BLOCK_SIZE + BLOCK_SIZE / 2; 
                return Math.abs(px - bx) < BLOCK_SIZE * MAX_REACH && Math.abs(py - by) < BLOCK_SIZE * MAX_REACH; 
            }

            function handleTouch(x, y) {
                var wx = Math.floor((x + camera.x) / BLOCK_SIZE), wy = Math.floor((y + camera.y) / BLOCK_SIZE);
                if (wx >= 0 && wx < WORLD_WIDTH && wy >= 0 && wy < WORLD_HEIGHT && isInReach(wx, wy)) {
                    if (mode === 'mine') { 
                        if (world[wx][wy] !== BLOCKS.AIR) { 
                            world[wx][wy] = BLOCKS.AIR; 
                        } 
                    } else {
                        if (world[wx][wy] === BLOCKS.AIR) {
                            var px = Math.floor(player.x / BLOCK_SIZE), py = Math.floor(player.y / BLOCK_SIZE); 
                            var pw = Math.ceil(player.width / BLOCK_SIZE), ph = Math.ceil(player.height / BLOCK_SIZE);
                            if (wx < px || wx >= px + pw || wy < py || wy >= py + ph) { 
                                world[wx][wy] = selectedBlock; 
                            }
                        }
                    }
                }
            }

            var isTouching = false;
            canvas.addEventListener('touchstart', function (e) { 
                e.preventDefault(); 
                isTouching = true; 
                handleTouch(e.touches[0].clientX, e.touches[0].clientY); 
            });
            canvas.addEventListener('touchmove', function (e) { 
                e.preventDefault(); 
                if (isTouching) { 
                    handleTouch(e.touches[0].clientX, e.touches[0].clientY); 
                } 
            });
            canvas.addEventListener('touchend', function (e) { 
                e.preventDefault(); 
                isTouching = false; 
            });

            function addButtonEvents(id, key) { 
                var btn = document.getElementById(id); 
                btn.addEventListener('touchstart', function (e) { 
                    e.preventDefault(); 
                    keys[key] = true; 
                }); 
                btn.addEventListener('touchend', function (e) { 
                    e.preventDefault(); 
                    keys[key] = false; 
                }); 
            }
            addButtonEvents('leftBtn', 'left'); 
            addButtonEvents('rightBtn', 'right'); 
            addButtonEvents('jumpBtn', 'jump');

            var modeBtn = document.getElementById('mode-indicator'); 
            modeBtn.addEventListener('touchstart', function (e) { 
                e.preventDefault(); 
                mode = mode === 'mine' ? 'place' : 'mine'; 
                this.textContent = mode === 'mine' ? 'MINE' : 'PLACE'; 
                this.className = mode === 'mine' ? 'mine-mode' : 'place-mode'; 
            });

            var currentDropdown = null;
            
            function closeAllDropdowns() {
                var allSlots = document.getElementsByClassName('inv-slot');
                for (var i = 0; i < allSlots.length; i++) {
                    allSlots[i].className = allSlots[i].className.replace(' show-dropdown', '');
                }
                currentDropdown = null;
            }

            function selectSlot(idx, blockType) {
                selectedSlot = idx;
                selectedBlock = blockType;
                var invDiv = document.getElementById('inventory');
                var slots = invDiv.getElementsByClassName('inv-slot');
                for (var j = 0; j < slots.length; j++) {
                    slots[j].className = slots[j].className.replace(' selected', '').replace(' show-dropdown', '');
                }
                slots[idx].className += ' selected';
            }

            function createInventory() {
                var invDiv = document.getElementById('inventory');
                for (var i = 0; i < inventory.length; i++) {
                    var slot = document.createElement('div');
                    slot.className = 'inv-slot';
                    if (i === selectedSlot) { 
                        slot.className += ' selected'; 
                    }
                    
                    var blockCanvas = document.createElement('canvas');
                    blockCanvas.width = 28;
                    blockCanvas.height = 28;
                    var blockCtx = blockCanvas.getContext('2d');
                    var bt = inventory[i];

                    if (textures[bt]) {
                        blockCtx.drawImage(textures[bt], 0, 0, 28, 28);
                    }

                    slot.appendChild(blockCanvas);
                    slot.setAttribute('data-index', i);
                    slot.setAttribute('data-block', bt);
                    
                    if (blockVariants[bt]) {
                        var dropdown = document.createElement('div');
                        dropdown.className = 'variant-dropdown';
                        
                        // Add variant indicator button
                        var indicator = document.createElement('div');
                        indicator.className = 'variant-indicator';
                        indicator.textContent = '+';
                        indicator.setAttribute('data-isbutton', 'true');
                        
                        var variants = blockVariants[bt];
                        for (var v = 0; v < variants.length; v++) {
                            var variantBlock = variants[v];
                            var variantOption = document.createElement('div');
                            variantOption.className = 'variant-option';
                            variantOption.setAttribute('data-variant', variantBlock);
                            
                            var variantCanvas = document.createElement('canvas');
                            variantCanvas.width = 28;
                            variantCanvas.height = 28;
                            var variantCtx = variantCanvas.getContext('2d');
                            
                            if (textures[variantBlock]) {
                                variantCtx.drawImage(textures[variantBlock], 0, 0, 28, 28);
                            }
                            
                            variantOption.appendChild(variantCanvas);
                            dropdown.appendChild(variantOption);
                        }
                        
                        slot.appendChild(indicator);
                        slot.appendChild(dropdown);
                    }
                    
                    invDiv.appendChild(slot);
                }
                
                // Single event delegation for all inventory interactions
                var touchStartX, touchStartY, touchStartTime, touchedElement;
                
                invDiv.addEventListener('touchstart', function(e) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    touchStartTime = Date.now();
                    touchedElement = e.target;
                });
                
                invDiv.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    
                    var touchEndTime = Date.now();
                    var touchDuration = touchEndTime - touchStartTime;
                    
                    // Ignore if touch was too long (probably a drag)
                    if (touchDuration > 1000) {
                        return;
                    }
                    
                    var target = touchedElement;
                    
                    // Find the closest parent elements
                    var clickedSlot = null;
                    var clickedIndicator = null;
                    var clickedVariant = null;
                    
                    var el = target;
                    while (el && el !== invDiv) {
                        if (el.className && el.className.indexOf('inv-slot') >= 0) {
                            clickedSlot = el;
                        }
                        if (el.className && el.className.indexOf('variant-indicator') >= 0) {
                            clickedIndicator = el;
                        }
                        if (el.className && el.className.indexOf('variant-option') >= 0) {
                            clickedVariant = el;
                        }
                        el = el.parentNode;
                    }
                    
                    // Handle variant option click
                    if (clickedVariant && clickedSlot) {
                        var idx = parseInt(clickedSlot.getAttribute('data-index'), 10);
                        var vBlock = parseInt(clickedVariant.getAttribute('data-variant'), 10);
                        
                        inventory[idx] = vBlock;
                        
                        var mainCanvas = clickedSlot.getElementsByTagName('canvas')[0];
                        var mainCtx = mainCanvas.getContext('2d');
                        mainCtx.clearRect(0, 0, 28, 28);
                        if (textures[vBlock]) {
                            mainCtx.drawImage(textures[vBlock], 0, 0, 28, 28);
                        }
                        clickedSlot.setAttribute('data-block', vBlock);
                        
                        selectSlot(idx, vBlock);
                        closeAllDropdowns();
                        return;
                    }
                    
                    // Handle + button click
                    if (clickedIndicator && clickedSlot) {
                        if (clickedSlot.className.indexOf('show-dropdown') >= 0) {
                            closeAllDropdowns();
                        } else {
                            closeAllDropdowns();
                            clickedSlot.className += ' show-dropdown';
                            currentDropdown = clickedSlot;
                        }
                        return;
                    }
                    
                    // Handle slot click (select block)
                    if (clickedSlot && !clickedIndicator && !clickedVariant) {
                        var idx = parseInt(clickedSlot.getAttribute('data-index'), 10);
                        var bt = parseInt(clickedSlot.getAttribute('data-block'), 10);
                        selectSlot(idx, bt);
                        closeAllDropdowns();
                        return;
                    }
                });
                
                invDiv.addEventListener('touchmove', function(e) {
                    // Allow scrolling but track if moved significantly
                    var moveX = Math.abs(e.touches[0].clientX - touchStartX);
                    var moveY = Math.abs(e.touches[0].clientY - touchStartY);
                    if (moveX > 10 || moveY > 10) {
                        touchedElement = null; // Cancel the touch
                    }
                });
            }

            window.addEventListener('resize', resizeCanvas);

            initWorld();
            selectedBlock = inventory[0];
            loadTextures();
        })();
    </script>
</body>

</html>

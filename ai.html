<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Gemini</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #f8f9fa;
            overflow: hidden;
        }
        
        #container {
            height: 100%;
        }
        
        #header {
            background: -webkit-gradient(linear, left top, right bottom, from(#667eea), to(#764ba2));
            color: #fff;
            padding: 14px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            -webkit-box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            letter-spacing: 0.5px;
            position: relative;
        }
        
        #setup {
            padding: 30px 20px;
            text-align: center;
        }
        
        #setup h2 {
            color: #5f6368;
            font-size: 20px;
            margin-bottom: 8px;
            font-weight: normal;
        }
        
        #setup p {
            color: #80868b;
            font-size: 13px;
            margin-bottom: 24px;
        }
        
        #setup select {
            width: 100%;
            padding: 14px;
            border: 2px solid #dadce0;
            -webkit-border-radius: 8px;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 16px;
            background: #fff;
        }
        
        #setup input {
            width: 100%;
            padding: 14px;
            border: 2px solid #dadce0;
            -webkit-border-radius: 8px;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 16px;
            background: #fff;
        }
        
        #setup button {
            width: 100%;
            padding: 14px;
            background: -webkit-gradient(linear, left top, right bottom, from(#667eea), to(#764ba2));
            color: #fff;
            border: none;
            -webkit-border-radius: 8px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            -webkit-box-shadow: 0 2px 6px rgba(102,126,234,0.4);
        }
        
        #messages {
            height: 380px;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            padding: 16px 12px;
            background: #f8f9fa;
        }
        
        .msg {
            margin-bottom: 16px;
            clear: both;
        }
        
        .msg-user {
            text-align: right;
        }
        
        .msg-ai {
            text-align: left;
        }
        
        .bubble {
            display: inline-block;
            max-width: 80%;
            padding: 12px 16px;
            -webkit-border-radius: 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            -webkit-box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .msg-user .bubble {
            background: -webkit-gradient(linear, left top, right bottom, from(#667eea), to(#764ba2));
            color: #fff;
            -webkit-border-bottom-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }
        
        .msg-ai .bubble {
            background: #fff;
            color: #202124;
            border: 1px solid #e8eaed;
            -webkit-border-bottom-left-radius: 4px;
            border-bottom-left-radius: 4px;
            text-align: left;
        }
        
        .msg-ai .bubble strong {
            font-weight: bold;
        }
        
        .msg-ai .bubble em {
            font-style: italic;
        }
        
        .msg-ai .bubble code {
            background: #f1f3f4;
            padding: 2px 4px;
            -webkit-border-radius: 3px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 13px;
        }
        
        .msg-ai .bubble ul, .msg-ai .bubble ol {
            margin: 8px 0 8px 20px;
        }
        
        .msg-ai .bubble li {
            margin: 4px 0;
        }
        
        .msg-ai .bubble p {
            margin: 8px 0;
        }
        
        .label {
            font-size: 11px;
            color: #80868b;
            margin-bottom: 4px;
            font-weight: 500;
        }
        
        .msg-user .label {
            text-align: right;
        }
        
        .msg-ai .label {
            text-align: left;
        }
        
        #input-area {
            background: #fff;
            border-top: 1px solid #e8eaed;
            padding: 12px;
            -webkit-box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
        }
        
        #input-container {
            background: #f1f3f4;
            -webkit-border-radius: 24px;
            border-radius: 24px;
            padding: 4px;
            overflow: hidden;
        }
        
        #input {
            width: 230px;
            float: left;
            padding: 10px 16px;
            border: none;
            background: transparent;
            font-size: 15px;
        }
        
        #send {
            width: 44px;
            height: 44px;
            float: right;
            background: -webkit-gradient(linear, left top, right bottom, from(#667eea), to(#764ba2));
            color: #fff;
            border: none;
            -webkit-border-radius: 22px;
            border-radius: 22px;
            font-size: 18px;
            font-weight: bold;
            -webkit-box-shadow: 0 2px 4px rgba(102,126,234,0.3);
        }
        
        #send:disabled {
            background: #dadce0;
            -webkit-box-shadow: none;
        }
        
        .hide {
            display: none !important;
        }
        
        .spinner {
            text-align: left;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        
        .spinner .bubble {
            background: #fff;
            border: 1px solid #e8eaed;
            color: #80868b;
            padding: 12px 16px;
        }
        
        #clear {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255,255,255,0.3);
            color: #fff;
            border: none;
            padding: 6px 12px;
            -webkit-border-radius: 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            AI Chat
            <button id="clear" class="hide" onclick="clearChat()">Clear</button>
        </div>
        
        <div id="setup">
            <h2>Welcome to Gemini</h2>
            <p>Choose model and enter API key</p>
            <select id="modelSelect">
                <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash (Recommended)</option>
                <option value="gemma-3-12b-it">Gemma 3 12B (Reasoning)</option>
                <option value="gemma-3-4b-it">Gemma 3 4B</option>
                <option value="gemma-3-1b-it">Gemma 3 1B</option>
            </select>
            <input type="password" id="key" placeholder="Paste your API key here">
            <button onclick="start()">Start Chatting</button>
        </div>
        
        <div id="messages" class="hide"></div>
        
        <div id="input-area" class="hide">
            <div id="input-container">
                <input type="text" id="input" placeholder="Ask me anything...">
                <button id="send" onclick="send()">➤</button>
                <div style="clear:both;"></div>
            </div>
        </div>
    </div>

    <script>
        var key = '';
        var msgs = [];
        var selectedModel = 'gemini-2.5-flash';
        
        function formatMarkdown(txt) {
            // Remove LaTeX commands
            txt = txt.replace(/\\text\{([^}]+)\}/g, '$1');
            txt = txt.replace(/\\[a-zA-Z]+\{([^}]+)\}/g, '$1');
            txt = txt.replace(/\\\(/g, '');
            txt = txt.replace(/\\\)/g, '');
            txt = txt.replace(/\\\[/g, '');
            txt = txt.replace(/\\\]/g, '');
            
            // Bold
            txt = txt.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            // Italic
            txt = txt.replace(/\*(.+?)\*/g, '<em>$1</em>');
            // Code
            txt = txt.replace(/`(.+?)`/g, '<code>$1</code>');
            
            // Split into lines
            var lines = txt.split('\n');
            var html = '';
            var inList = false;
            var listType = '';
            
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                var trimmed = line.replace(/^\s+/, '');
                
                // Bullet list
                if (trimmed.indexOf('* ') === 0 || trimmed.indexOf('- ') === 0) {
                    if (!inList || listType !== 'ul') {
                        if (inList) html += '</' + listType + '>';
                        html += '<ul>';
                        inList = true;
                        listType = 'ul';
                    }
                    html += '<li>' + trimmed.substring(2) + '</li>';
                }
                // Numbered list
                else if (trimmed.match(/^\d+\.\s/)) {
                    if (!inList || listType !== 'ol') {
                        if (inList) html += '</' + listType + '>';
                        html += '<ol>';
                        inList = true;
                        listType = 'ol';
                    }
                    html += '<li>' + trimmed.replace(/^\d+\.\s/, '') + '</li>';
                }
                // Regular line
                else {
                    if (inList) {
                        html += '</' + listType + '>';
                        inList = false;
                        listType = '';
                    }
                    if (line.length > 0) {
                        html += line + '<br>';
                    } else {
                        html += '<br>';
                    }
                }
            }
            
            if (inList) {
                html += '</' + listType + '>';
            }
            
            return html;
        }
        
        function start() {
            key = document.getElementById('key').value.replace(/\s/g, '');
            selectedModel = document.getElementById('modelSelect').value;
            
            if (!key) {
                alert('Please enter your API key');
                return;
            }
            document.getElementById('setup').className = 'hide';
            document.getElementById('messages').className = '';
            document.getElementById('input-area').className = '';
            document.getElementById('clear').className = '';
            document.getElementById('input').focus();
        }
        
        function add(txt, user, modelName) {
            var m = document.getElementById('messages');
            var d = document.createElement('div');
            d.className = 'msg ' + (user ? 'msg-user' : 'msg-ai');
            
            var lbl = document.createElement('div');
            lbl.className = 'label';
            if (user) {
                lbl.appendChild(document.createTextNode('You'));
            } else {
                var labelText = modelName || 'AI';
                lbl.appendChild(document.createTextNode(labelText));
            }
            d.appendChild(lbl);
            
            var b = document.createElement('div');
            b.className = 'bubble';
            if (user) {
                b.appendChild(document.createTextNode(txt));
            } else {
                b.innerHTML = formatMarkdown(txt);
            }
            d.appendChild(b);
            m.appendChild(d);
            m.scrollTop = m.scrollHeight;
        }
        
        function loading(show) {
            var l = document.getElementById('load');
            if (show) {
                if (!l) {
                    l = document.createElement('div');
                    l.id = 'load';
                    l.className = 'spinner';
                    var lbl = document.createElement('div');
                    lbl.className = 'label';
                    lbl.appendChild(document.createTextNode('AI'));
                    l.appendChild(lbl);
                    var b = document.createElement('div');
                    b.className = 'bubble';
                    b.appendChild(document.createTextNode('●●●'));
                    l.appendChild(b);
                    document.getElementById('messages').appendChild(l);
                }
                var m = document.getElementById('messages');
                m.scrollTop = m.scrollHeight;
            } else if (l) {
                l.parentNode.removeChild(l);
            }
        }
        
        function send() {
            var inp = document.getElementById('input');
            var txt = inp.value.replace(/^\s+|\s+$/g, '');
            if (!txt) return;
            
            add(txt, true);
            msgs.push({role: 'user', parts: [{text: txt}]});
            inp.value = '';
            
            var btn = document.getElementById('send');
            btn.disabled = true;
            loading(true);
            
            var x = new XMLHttpRequest();
            x.open('POST', 'https://generativelanguage.googleapis.com/v1beta/models/' + selectedModel + ':generateContent?key=' + key);
            x.setRequestHeader('Content-Type', 'application/json');
            
            x.onreadystatechange = function() {
                if (x.readyState == 4) {
                    loading(false);
                    btn.disabled = false;
                    
                    if (x.status == 200) {
                        try {
                            var r = JSON.parse(x.responseText);
                            var t = r.candidates[0].content.parts[0].text;
                            
                            // Format model name for display
                            var displayName = selectedModel.replace('-it', '').replace(/-/g, ' ');
                            displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);
                            
                            add(t, false, displayName);
                            msgs.push({role: 'model', parts: [{text: t}]});
                        } catch(e) {
                            add('Error parsing response', false, 'Error');
                        }
                    } else if (x.status == 429) {
                        add('Rate limit exceeded. Please wait and try again later.', false, 'Error');
                    } else {
                        add('Error ' + x.status + ': Request failed. Please try again.', false, 'Error');
                    }
                    document.getElementById('input').focus();
                }
            };
            
            x.send(JSON.stringify({contents: msgs}));
        }
        
        function clearChat() {
            if (confirm('Clear all messages?')) {
                msgs = [];
                document.getElementById('messages').innerHTML = '';
            }
        }
        
        document.getElementById('input').onkeypress = function(e) {
            if (e.keyCode == 13) send();
        };
    </script>
</body>
</html>

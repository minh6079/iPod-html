<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Gemini</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        background: #f8f9fa;
        overflow: hidden;
        position: fixed;
      }

      #container {
        width: 100%;
        height: 100%;
        position: relative;
      }

      #header {
        background: -webkit-gradient(linear, left top, right bottom, from(#667eea), to(#764ba2));
        color: #fff;
        padding: 12px 10px;
        font-size: 16px;
        font-weight: bold;
        -webkit-box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        position: relative;
        height: 44px;
        line-height: 20px;
      }

      #header-title {
        position: absolute;
        left: 0;
        right: 0;
        top: 12px;
        text-align: center;
      }

      #setup {
        padding: 20px 15px;
        text-align: center;
      }

      #setup h2 {
        color: #5f6368;
        font-size: 18px;
        margin-bottom: 6px;
        font-weight: normal;
      }

      #setup p {
        color: #80868b;
        font-size: 12px;
        margin-bottom: 20px;
      }

      #setup select {
        width: 100%;
        padding: 12px;
        border: 2px solid #dadce0;
        -webkit-border-radius: 8px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 12px;
        background: #fff;
      }

      #setup input {
        width: 100%;
        padding: 12px;
        border: 2px solid #dadce0;
        -webkit-border-radius: 8px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 12px;
        background: #fff;
      }

      #setup button {
        width: 100%;
        padding: 12px;
        background: -webkit-gradient(linear, left top, right bottom, from(#667eea), to(#764ba2));
        color: #fff;
        border: none;
        -webkit-border-radius: 8px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: bold;
        -webkit-box-shadow: 0 2px 6px rgba(102, 126, 234, 0.4);
      }

      #messages {
        position: absolute;
        top: 44px;
        left: 0;
        right: 0;
        bottom: 64px;
        overflow-y: scroll;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        padding: 12px 10px;
        background: #f8f9fa;
      }

      .msg {
        margin-bottom: 12px;
        clear: both;
        width: 100%;
      }

      .msg-user {
        text-align: right;
      }

      .msg-ai {
        text-align: left;
      }

      .bubble {
        display: inline-block;
        max-width: 70%;
        padding: 10px 12px;
        -webkit-border-radius: 16px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.4;
        word-wrap: break-word;
        word-break: break-word;
        white-space: pre-wrap;
        -webkit-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }

      .msg-user .bubble {
        background: -webkit-gradient(linear, left top, right bottom, from(#667eea), to(#764ba2));
        color: #fff;
        -webkit-border-bottom-right-radius: 4px;
        border-bottom-right-radius: 4px;
      }

      .msg-ai .bubble {
        background: #fff;
        color: #202124;
        border: 1px solid #e8eaed;
        -webkit-border-bottom-left-radius: 4px;
        border-bottom-left-radius: 4px;
        text-align: left;
      }

      .msg-ai .bubble strong {
        font-weight: bold;
      }

      .msg-ai .bubble em {
        font-style: italic;
      }

      .msg-ai .bubble code {
        background: #f1f3f4;
        padding: 2px 4px;
        -webkit-border-radius: 3px;
        border-radius: 3px;
        font-family: monospace;
        font-size: 13px;
      }

      .msg-ai .bubble ul,
      .msg-ai .bubble ol {
        margin: 6px 0 6px 18px;
      }

      .msg-ai .bubble li {
        margin: 3px 0;
      }

      .msg-ai .bubble p {
        margin: 6px 0;
      }

      .label {
        font-size: 10px;
        color: #80868b;
        margin-bottom: 3px;
        font-weight: 500;
      }

      .msg-user .label {
        text-align: right;
      }

      .msg-ai .label {
        text-align: left;
      }

      #input-area {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 64px;
        background: #fff;
        border-top: 1px solid #e8eaed;
        padding: 10px;
        -webkit-box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.05);
      }

      #input-container {
        background: #f1f3f4;
        -webkit-border-radius: 22px;
        border-radius: 22px;
        padding: 4px;
        height: 44px;
      }

      #input {
        width: 220px;
        float: left;
        padding: 8px 12px;
        border: none;
        background: transparent;
        font-size: 14px;
        height: 36px;
      }

      #send {
        width: 36px;
        height: 36px;
        float: right;
        background: -webkit-gradient(linear, left top, right bottom, from(#667eea), to(#764ba2));
        color: #fff;
        border: none;
        -webkit-border-radius: 18px;
        border-radius: 18px;
        font-size: 16px;
        font-weight: bold;
        -webkit-box-shadow: 0 2px 4px rgba(102, 126, 234, 0.3);
      }

      #send:disabled {
        background: #dadce0;
        -webkit-box-shadow: none;
      }

      .hide {
        display: none !important;
      }

      .spinner {
        text-align: left;
        padding: 10px 0;
        margin-bottom: 12px;
      }

      .spinner .bubble {
        background: #fff;
        border: 1px solid #e8eaed;
        color: #80868b;
        padding: 10px 12px;
      }

      #clear {
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(255, 255, 255, 0.25);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 5px 8px;
        -webkit-border-radius: 10px;
        border-radius: 10px;
        font-size: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="header">
        <span id="header-title">AI Chat</span>
        <button id="clear" class="hide" onclick="clearChat()">Clear</button>
      </div>
      <div id="setup">
        <h2>Welcome to Gemini</h2>
        <p>Choose model and enter API key</p>
        <select id="modelSelect">
          <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash</option>
          <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite</option>
          <option value="gemma-3-4b-it">Gemma 3 4B</option>
          <option value="gemma-3-1b-it">Gemma 3 1B</option>
        </select>
        <input type="password" id="key" placeholder="Paste your API key here">
        <button onclick="start()">Start Chatting</button>
      </div>
      <div id="messages" class="hide"></div>
      <div id="input-area" class="hide">
        <div id="input-container">
          <input type="text" id="input" placeholder="Ask me anything...">
          <button id="send" onclick="send()">➤</button>
          <div style="clear:both;"></div>
        </div>
      </div>
    </div>
    <script>
      var key = '';
      var msgs = [];
      var selectedModel = 'gemini-2.5-flash';

      function formatMarkdown(txt) {
        // Remove LaTeX commands
        txt = txt.replace(/\\text\{([^}]+)\}/g, '$1');
        txt = txt.replace(/\\[a-zA-Z]+\{([^}]+)\}/g, '$1');
        txt = txt.replace(/\\\(/g, '');
        txt = txt.replace(/\\\)/g, '');
        txt = txt.replace(/\\\[/g, '');
        txt = txt.replace(/\\\]/g, '');
        // Bold
        txt = txt.replace(/\*\*(.+?)\*\*/g, ' < strong > $1 < /strong>');
            // Italic
            txt = txt.replace(/\*(.+?)\*/g, ' < em > $1 < /em>');
              // Code
              txt = txt.replace(/`(.+?)`/g, ' < code > $1 < /code>');
                // Split into lines
                var lines = txt.split('\n');
                var html = '';
                var inList = false;
                var listType = '';
                for (var i = 0; i < lines.length; i++) {
                  var line = lines[i];
                  var trimmed = line.replace(/^\s+/, '');
                  // Bullet list
                  if (trimmed.indexOf('* ') === 0 || trimmed.indexOf('- ') === 0) {
                    if (!inList || listType !== 'ul') {
                      if (inList) html += ' < /' + listType + '>';
                      html += ' < ul > ';
                      inList = true;
                      listType = 'ul';
                    }
                    html += ' < li > ' + trimmed.substring(2) + ' < /li>';
                  }
                  // Numbered list
                  else if (trimmed.match(/^\d+\.\s/)) {
                    if (!inList || listType !== 'ol') {
                      if (inList) html += ' < /' + listType + '>';
                      html += ' < ol > ';
                      inList = true;
                      listType = 'ol';
                    }
                    html += ' < li > ' + trimmed.replace(/^\d+\.\s/, '
                    ') + ' < /li>';
                  }
                  // Regular line
                  else {
                    if (inList) {
                      html += ' < /' + listType + '>';
                      inList = false;
                      listType = '';
                    }
                    if (line.length > 0) {
                      html += line + ' < br > ';
                    } else {
                      html += ' < br > ';
                    }
                  }
                }
                if (inList) {
                  html += ' < /' + listType + '>';
                }
                return html;
              }

              function start() {
                key = document.getElementById('key').value.replace(/\s/g, '');
                selectedModel = document.getElementById('modelSelect').value;
                if (!key) {
                  alert('Please enter your API key');
                  return;
                }
                document.getElementById('setup').className = 'hide';
                document.getElementById('messages').className = '';
                document.getElementById('input-area').className = '';
                document.getElementById('clear').className = '';
                document.getElementById('input').focus();
              }

              function add(txt, user, modelName) {
                var m = document.getElementById('messages');
                var d = document.createElement('div');
                d.className = 'msg ' + (user ? 'msg-user' : 'msg-ai');
                var lbl = document.createElement('div');
                lbl.className = 'label';
                if (user) {
                  lbl.appendChild(document.createTextNode('You'));
                } else {
                  var labelText = modelName || 'AI';
                  lbl.appendChild(document.createTextNode(labelText));
                }
                d.appendChild(lbl);
                var b = document.createElement('div');
                b.className = 'bubble';
                if (user) {
                  b.appendChild(document.createTextNode(txt));
                } else {
                  b.innerHTML = formatMarkdown(txt);
                }
                d.appendChild(b);
                m.appendChild(d);
                m.scrollTop = m.scrollHeight;
              }

              function loading(show) {
                var l = document.getElementById('load');
                if (show) {
                  if (!l) {
                    l = document.createElement('div');
                    l.id = 'load';
                    l.className = 'spinner';
                    var lbl = document.createElement('div');
                    lbl.className = 'label';
                    lbl.appendChild(document.createTextNode('AI'));
                    l.appendChild(lbl);
                    var b = document.createElement('div');
                    b.className = 'bubble';
                    b.appendChild(document.createTextNode('●●●'));
                    l.appendChild(b);
                    document.getElementById('messages').appendChild(l);
                  }
                  var m = document.getElementById('messages');
                  m.scrollTop = m.scrollHeight;
                } else if (l) {
                  l.parentNode.removeChild(l);
                }
              }

              function send() {
                var inp = document.getElementById('input');
                var txt = inp.value.replace(/^\s+|\s+$/g, '');
                if (!txt) return;
                add(txt, true);
                msgs.push({
                  role: 'user',
                  parts: [{
                    text: txt
                  }]
                });
                inp.value = '';
                var btn = document.getElementById('send');
                btn.disabled = true;
                loading(true);
                var x = new XMLHttpRequest();
                x.open('POST', 'https://generativelanguage.googleapis.com/v1beta/models/' + selectedModel + ':generateContent?key=' + key);
                x.setRequestHeader('Content-Type', 'application/json');
                x.onreadystatechange = function() {
                  if (x.readyState == 4) {
                    loading(false);
                    btn.disabled = false;
                    if (x.status == 200) {
                      try {
                        var r = JSON.parse(x.responseText);
                        var t = r.candidates[0].content.parts[0].text;
                        // Format model name for display
                        var displayName = selectedModel.replace('-it', '').replace(/-/g, ' ');
                        displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);
                        add(t, false, displayName);
                        msgs.push({
                          role: 'model',
                          parts: [{
                            text: t
                          }]
                        });
                      } catch (e) {
                        add('Error parsing response', false, 'Error');
                      }
                    } else if (x.status == 429) {
                      add('Rate limit exceeded. Please wait and try again later.', false, 'Error');
                    } else {
                      add('Error ' + x.status + ': Request failed. Please try again.', false, 'Error');
                    }
                    document.getElementById('input').focus();
                  }
                };
                x.send(JSON.stringify({
                  contents: msgs
                }));
              }

              function clearChat() {
                if (confirm('Clear all messages?')) {
                  msgs = [];
                  document.getElementById('messages').innerHTML = '';
                }
              }
              document.getElementById('input').onkeypress = function(e) {
                if (e.keyCode == 13) send();
              };
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
<body style="margin:0; background:#000;">
<canvas id="c"></canvas>
<script>
var c = document.getElementById("c");
var ctx = c.getContext("2d");
var p = [];

function resize() {
    c.width = window.innerWidth || document.body.clientWidth;
    c.height = window.innerHeight || document.body.clientHeight;
}
resize();
window.onresize = resize;

// fallback for old Safari
var requestAnimFrame = window.requestAnimationFrame || 
                       window.webkitRequestAnimationFrame || 
                       window.mozRequestAnimationFrame || 
                       function(f){ setTimeout(f, 33); };

function loop() {
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(0,0,c.width,c.height);

    if (p.length < 30) { // fewer particles for speed
        p.push({
            x: c.width/2,
            y: c.height - 50,
            dx: (Math.random() - 0.5) * 4,
            dy: -Math.random() * 4
        });
    }

    for (var i = p.length-1; i >= 0; i--) {
        var a = p[i];
        a.x += a.dx;
        a.y += a.dy;
        a.dy += 0.2;

        ctx.fillStyle = "hsl(" + ((i*10)%360) + ",80%,60%)";
        ctx.fillRect(a.x, a.y, 2, 2);

        if (a.y > c.height) p.splice(i,1);
    }

    requestAnimFrame(loop);
}
loop();
</script>
</body>
</html>

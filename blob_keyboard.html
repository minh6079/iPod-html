<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta property="og:title" content="Blob Keyboard Simulator. Back to 2005!">
  <meta property="og:description"
    content="Experience Ken Kocienda's early iteration of the original iPhone keyboard: the Blob Keyboard from september 2005.">
  <meta property="og:image" content="https://juliendorra.github.io/blob-keyboard-simulator/preview.jpeg">
  <meta property="og:url" content="https://juliendorra.github.io/blob-keyboard-simulator/blob-keyboard-simulator.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <title>Blob Keyboard Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }

    button {
      background: none;
      border: none;
      font: inherit;
      cursor: pointer;
      outline: inherit;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    html {
      height: 100%;
      -webkit-touch-callout: none;
    }

    body {
      height: 100%;
      background-color: #333;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    #phone {
      width: 320px;
      height: 480px;
      background-color: black;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-left: -160px;
      margin-top: -240px;
      overflow: hidden;
    }

    /* Status Bar */
    #status-bar {
      width: 320px;
      height: 20px;
      background-color: black;
      color: white;
      position: absolute;
      top: 0;
      left: 0;
      font-size: 11px;
      line-height: 20px;
    }

    #dots {
      position: absolute;
      left: 10px;
      top: 7px;
      height: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 3px;
      background-color: white;
      margin-right: 3px;
      float: left;
    }

    .dot:last-child {
      background-color: transparent;
      border: 1px solid white;
      margin-right: 0;
    }

    #time {
      position: absolute;
      left: 50%;
      top: 0;
      margin-left: -20px;
      width: 40px;
      text-align: center;
    }

    #battery {
      position: absolute;
      right: 10px;
      top: 5px;
    }

    /* Text Area */
    #text-area {
      width: 320px;
      height: 150px;
      background-color: white;
      padding: 10px;
      font-size: 20px;
      overflow: auto;
      word-wrap: break-word;
      -webkit-overflow-scrolling: touch;
      position: absolute;
      top: 20px;
      left: 0;
    }

    #cursor {
      display: inline-block;
      width: 2px;
      height: 20px;
      background-color: #0004d4;
      -webkit-animation: blink 1s infinite;
      animation: blink 1s infinite;
      vertical-align: middle;
    }

    #cursor-input {
      display: inline-block;
      width: 2px;
      height: 18px;
      background-color: #f79b2b;
      -webkit-animation: blink 1s infinite;
      animation: blink 1s infinite;
      vertical-align: middle;
    }

    @-webkit-keyframes blink {

      0%,
      49% {
        opacity: 1;
      }

      50%,
      100% {
        opacity: 0;
      }
    }

    @keyframes blink {

      0%,
      49% {
        opacity: 1;
      }

      50%,
      100% {
        opacity: 0;
      }
    }

    /* Keyboard Container */
    #keyboard {
      position: absolute;
      top: 179px;
      left: 9px;
      width: 302px;
      height: 292px;
      background-color: black;
    }

    /* Top Row: clear | text-input | accept */
    .top-row {
      position: absolute;
      top: 0;
      left: 0;
      width: 302px;
      height: 45px;
    }

    .top-row>button:first-child {
      position: absolute;
      left: 0;
      top: 0;
      width: 60px;
      height: 45px;
    }

    .top-row #text-input {
      position: absolute;
      left: 80px;
      top: 0;
      width: 142px;
      height: 45px;
    }

    .top-row>button:last-child {
      position: absolute;
      right: 0;
      top: 0;
      width: 60px;
      height: 45px;
    }

    /* Keyboard Rows - with proper spacing */
    #keyboard>div:nth-child(2) {
      position: absolute;
      top: 57px;
      left: 0;
      width: 302px;
      height: 55px;
    }

    #keyboard>div:nth-child(3) {
      position: absolute;
      top: 124px;
      left: 0;
      width: 302px;
      height: 55px;
    }

    #keyboard>div:nth-child(4) {
      position: absolute;
      top: 191px;
      left: 0;
      width: 302px;
      height: 55px;
    }

    /* Blob keys - equal width with 20px gaps */
    .keyboard-row>div:nth-child(1) {
      position: absolute;
      left: 0;
      top: 0;
      width: 60px;
      height: 55px;
    }

    .keyboard-row>div:nth-child(2) {
      position: absolute;
      left: 80px;
      top: 0;
      width: 61px;
      height: 55px;
    }

    .keyboard-row>div:nth-child(3) {
      position: absolute;
      left: 161px;
      top: 0;
      width: 61px;
      height: 55px;
    }

    .keyboard-row>div:nth-child(4) {
      position: absolute;
      right: 0;
      top: 0;
      width: 60px;
      height: 55px;
    }

    /* Bottom Row: shift | space | 123 */
    .bottom-row {
      position: absolute;
      top: 254px;
      left: 0;
      width: 302px;
      height: 40px;
    }

    .bottom-row>button:first-child {
      position: absolute;
      left: 0px;
      top: 0;
      width: 60px;
      height: 40px;
    }

    .bottom-row>button {
      position: absolute;
      left: 78px;
      top: 0;
      width: 146px;
      height: 40px;
    }

    .bottom-row>button:last-child {
      position: absolute;
      left: 242px;
      top: 0;
      width: 60px;
      height: 40px;
    }

    /* Key Styling */
    .key {
      background-color: black;
      border: 2px solid #f79b2b;
      border-radius: 10px;
      text-align: center;
      font-size: 16px;
      -webkit-box-shadow: 0 1px 1px rgba(0, 0, 0, 0.2);
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.2);
      color: #f79b2b;
      position: relative;
    }

    .blob-key {
      border-radius: 50px 50px 0 0;
    }

    .blob-key span {
      position: absolute;
      font-size: 16px;
      color: #f79b2b;
    }

    .left-letter {
      left: 4px;
      bottom: 4px;
    }

    .center-letter {
      top: 2px;
      left: 57%;
      margin-left: -8px;
    }

    .right-letter {
      right: 4px;
      bottom: 4px;
    }

    #text-input {
      text-align: center;
      border: 1px solid #f79b2b;
      padding: 10px;
      font-size: 18px;
      overflow: hidden;
      color: black;
      background-color: white;
      white-space: pre-wrap;
      line-height: 1.2;
    }

    .gesture-feedback {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 5px;
      background-color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      display: none;
      z-index: 10;
    }

    /* Active States */
    .key:active {
      color: #3aeb3a !important;
      border-color: #3aeb3a !important;
    }

    button.key:active {
      color: #3aeb3a !important;
      border-color: #3aeb3a !important;
    }

    .action-button-active {
      color: #3aeb3a !important;
      border-color: #3aeb3a !important;
    }

    .key-active {
      color: #3aeb3a !important;
      border-color: #3aeb3a !important;
      -webkit-transform: scaleX(1) scaleY(1.1) translate(0, -2px);
      transform: scaleX(1) scaleY(1.1) translate(0, -2px);
    }

    .key-active-left {
      color: #3aeb3a !important;
      border-color: #3aeb3a !important;
      -webkit-transform: skewX(11deg) scaleX(1) scaleY(1.1) translate(-5px, -2px);
      transform: skewX(11deg) scaleX(1) scaleY(1.1) translate(-5px, -2px);
    }

    .key-active-right {
      color: #3aeb3a !important;
      border-color: #3aeb3a !important;
      -webkit-transform: skewX(-11deg) scaleX(1) scaleY(1.1) translate(5px, -2px);
      transform: skewX(-11deg) scaleX(1) scaleY(1.1) translate(5px, -2px);
    }

    .key-active-right .right-letter {
      top: 2px;
      bottom: auto;
      right: 20px;
      -webkit-transform: skewX(11deg) scaleX(1) scaleY(0.8);
      transform: skewX(11deg) scaleX(1) scaleY(0.8);
    }

    .key-active-left .left-letter {
      top: 2px;
      bottom: auto;
      left: 20px;
      -webkit-transform: skewX(-11deg) scaleX(1) scaleY(0.8);
      transform: skewX(-11deg) scaleX(1) scaleY(0.8);
    }

    .key-active .center-letter {
      -webkit-transform: scaleX(1) scaleY(0.8);
      transform: scaleX(1) scaleY(0.8);
    }

    .active-letter {
      border-color: #3aeb3a !important;
      color: #3aeb3a !important;
      z-index: 10;
    }

    .hidden-letter {
      display: none;
    }
  </style>
</head>

<body>
  <div id="phone">
    <div id="status-bar">
      <div id="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div id="time">9:41</div>
      <div id="battery">
        <svg width="20" height="10" viewBox="0 0 20 10">
          <rect x="0" y="0" width="18" height="10" stroke="white" fill="none" rx="2" ry="2" />
          <rect x="18" y="3" width="2" height="4" fill="white" />
          <rect x="2" y="2" width="14" height="6" fill="white" />
        </svg>

    <div id="keyboard">
      <div class="top-row">
        <button class="key action-button" id="clear">clear</button>
        <div class="key" id="text-input"><span id="cursor-input"></span></div>
        <button class="key action-button" id="accept">accept</button>
      </div>

      <div class="keyboard-row">
        <div class="key blob-key" data-letters="bac">
          <span class="left-letter">b</span>

          <span class="right-letter">c</span>
        </div>
        <div class="key blob-key" data-letters="fdg">
          <span class="left-letter">f</span>

        </div>
        <div class="key blob-key" data-letters="jek">
          <span class="left-letter">j</span>
          <span class="center-letter">e</span>
          <span class="right-letter">k</span>
        </div>
        <div class="key blob-key" data-letters="mhp">
          <span class="left-letter">m</span>
          <span class="center-letter">h</span>
          <span class="right-letter">p</span>
        </div>
      </div>

      <div class="keyboard-row">
        <div class="key blob-key" data-letters="qiv">
          <span class="left-letter">q</span>
          <span class="center-letter">i</span>
          <span class="right-letter">v</span>
        </div>
        <div class="key blob-key" data-letters="wlx">
          <span class="left-letter">w</span>

        </div>
        <div class="key blob-key" data-letters="ynz">
          <span class="left-letter">y</span>

        </div>
        <div class="key blob-key" data-letters=".o?">
          <span class="left-letter">.</span>

      <div class="keyboard-row">
        <div class="key blob-key" data-letters=",r-">
          <span class="left-letter">,</span>

        </div>
        <div class="key blob-key" data-letters="@s'">
          <span class="left-letter">@</span>

        <div class="key blob-key" data-letters=":t\">
          <span class="left-letter">:</span>

        </div>
        <div class="key blob-key" data-letters="/u!">
          <span class="left-letter">/</span>

        </div>
      </div>

      <div class="bottom-row">
        <button class="key action-button" id="shift">shift</button>

        <button class="key action-button" id="numbers">123</button>
      </div>
    </div>

    <div class="gesture-feedback"></div>
  </div>

  <script>
    // Set DEBUG flag based on URL fragment
    var DEBUG = window.location.hash === '#debug' || window.location.hash === '#DEBUG';
    document.addEventListener('DOMContentLoaded', function () {
      var blobKeys = document.querySelectorAll('.blob-key');
      var textInput = document.getElementById('text-input');
      var textContent = document.getElementById('text-content');
      var cursor = document.getElementById('cursor');
      var cursorInput = document.getElementById('cursor-input');
      var gestureDisplay = document.querySelector('.gesture-feedback');
      var clearBtn = document.getElementById('clear');
      var acceptBtn = document.getElementById('accept');
      var spaceBtn = document.getElementById('space');
      var textArea = document.getElementById('text-area');
      var inputText = '';
      var startX;
      var startY;
      var isMouseDown = false;
      var mainCursorPosition = textContent.textContent.length;
      var inputCursorPosition = 0;
      var activeKey = null;
      // Add this flag to track touch events
      var touchProcessed = false;

      // Hysteresis constants for letter selection
      var HYSTERESIS = {
        LEFT_THRESHOLD: -15,
        // Need to move this far left to switch to left letter
        LEFT_MAINTAIN: -5,
        // Need to move this far right to leave left letter
        RIGHT_THRESHOLD: 15,
        // Need to move this far right to switch to right letter
        RIGHT_MAINTAIN: 5 // Need to move this far left to leave right letter
      };

      // Current letter position (0 = left, 1 = center, 2 = right)
      var currentLetterPosition = 1;

      // Initialize text shown to user
      textInput.innerHTML = inputText + '<span id="cursor-input"></span>';

      // Function to reset all keys
      function resetAllKeys() {
        blobKeys.forEach(function (key) {
          key.classList.remove('key-active');
          key.classList.remove('key-active-left');
          key.classList.remove('key-active-right');

          // Reset visibility and styling of all letters
          var letters = key.querySelectorAll('span');
          letters.forEach(function (letter) {
            letter.classList.remove('active-letter');
            letter.classList.remove('hidden-letter');
          });
        });
      }

      // Handle touch/mouse events for blob keys
      blobKeys.forEach(function (key) {
        // Desktop mouse events
        key.addEventListener('mousedown', function (e) {
          // Skip if this was triggered by a touch event
          if (touchProcessed) return;
          isMouseDown = true;
          activeKey = this;
          startGesture.call(this, e);
        });
        key.addEventListener('mousemove', function (e) {
          // Skip if this was triggered by a touch event
          if (touchProcessed) return;
          if (isMouseDown && this === activeKey) {
            updateKeyVisuals(this, e);
          }
        });
        key.addEventListener('mouseup', function (e) {
          // Skip if this was triggered by a touch event
          if (touchProcessed) {
            touchProcessed = false;
            return;
          }
          if (isMouseDown && this === activeKey) {
            isMouseDown = false;
            endGesture.call(this, e);
            setTimeout(function () {
              resetAllKeys();
            }, 200);
          }
        });
        key.addEventListener('mouseleave', function (e) {
          // Skip if this was triggered by a touch event
          if (touchProcessed) return;

          // Only update visuals but don't trigger letter selection
          if (isMouseDown && this === activeKey) {
            // Remove visual active state from this key when mouse leaves
            this.classList.remove('key-active');
            this.classList.remove('key-active-left');
            this.classList.remove('key-active-right');
            var letters = this.querySelectorAll('span');
            letters.forEach(function (letter) {
              letter.classList.remove('active-letter');
              letter.classList.remove('hidden-letter');
            });

            // Note: We do NOT set isMouseDown to false or call endGesture
            // We still keep track of which key is active
          }
        });

        // Mobile touch events
        key.addEventListener('touchstart', function (e) {
          activeKey = this;
          touchProcessed = true;
          startGesture.call(this, e);
        }, {
          passive: true
        });
        key.addEventListener('touchmove', function (e) {
          if (this === activeKey) {
            var touch = e.touches[0];
            var xDiff = touch.clientX - startX;

            // Reset this key's style
            this.classList.remove('key-active');
            this.classList.remove('key-active-left');
            this.classList.remove('key-active-right');

            // Reset all letter styles
            var letters = this.querySelectorAll('span');
            letters.forEach(function (letter) {
              letter.classList.remove('active-letter');
              letter.classList.remove('hidden-letter');
            });

            // Apply hysteresis to get the letter position
            currentLetterPosition = getLetterPositionWithHysteresis(xDiff);
            if (currentLetterPosition === 1) {
              // Center - show only center letter
              this.classList.add('key-active');
              highlightLetter(this, 1);
            } else if (currentLetterPosition === 0) {
              // Left - show only left letter
              this.classList.add('key-active-left');
              highlightLetter(this, 0);
            } else {
              // Right - show only right letter
              this.classList.add('key-active-right');
              highlightLetter(this, 2);
            }
          }
        }, {
          passive: true
        });
        key.addEventListener('touchend', function (e) {
          if (this === activeKey) {
            endGesture.call(this, e);
            touchProcessed = true; // Set flag to prevent mouseup from firing
            setTimeout(function () {
              resetAllKeys();
              // Reset the flag after a short delay
              setTimeout(function () {
                touchProcessed = false;
              }, 300);
            }, 200);
          }
        });
        key.addEventListener('touchcancel', function () {
          if (this === activeKey) {
            cancelGesture.call(this);
            resetAllKeys();
            touchProcessed = false;
          }
        });
      });

      // Function to highlight a specific letter and hide others
      function highlightLetter(key, letterIndex) {
        var letters = key.querySelectorAll('span');
        letters.forEach(function (letter, idx) {
          if (idx === letterIndex) {
            letter.classList.add('active-letter');
          } else {
            letter.classList.add('hidden-letter');
          }
        });
      }

      // Function to determine letter position with hysteresis
      function getLetterPositionWithHysteresis(xDiff) {
        // Apply different thresholds based on current position
        switch (currentLetterPosition) {
          case 0:
            // Currently on left letter
            if (xDiff > HYSTERESIS.LEFT_MAINTAIN) {
              // Moving right from left letter
              return xDiff > HYSTERESIS.RIGHT_THRESHOLD ? 2 : 1;
            }
            return 0;
          // Stay on left letter

          case 1:
            // Currently on center letter
            if (xDiff < HYSTERESIS.LEFT_THRESHOLD) return 0; // Move to left
            if (xDiff > HYSTERESIS.RIGHT_THRESHOLD) return 2; // Move to right
            return 1;
          // Stay on center

          case 2:
            // Currently on right letter
            if (xDiff < HYSTERESIS.RIGHT_MAINTAIN) {
              // Moving left from right letter
              return xDiff < HYSTERESIS.LEFT_THRESHOLD ? 0 : 1;
            }
            return 2;
          // Stay on right letter

          default:
            return 1;
          // Default to center
        }
      }

      // Helper function to update key visuals based on current swipe position
      function updateKeyVisuals(key, e) {
        var touch = e.type === 'touchmove' ? e.touches[0] : e;
        var xDiff = touch.clientX - startX;

        // Reset this key's style
        key.classList.remove('key-active');
        key.classList.remove('key-active-left');
        key.classList.remove('key-active-right');

        // Reset all letter styles
        var letters = key.querySelectorAll('span');
        letters.forEach(function (letter) {
          letter.classList.remove('active-letter');
          letter.classList.remove('hidden-letter');
        });

        // Apply hysteresis to get the letter position
        currentLetterPosition = getLetterPositionWithHysteresis(xDiff);
        if (currentLetterPosition === 1) {
          // Center - show only center letter
          key.classList.add('key-active');
          highlightLetter(key, 1);
        } else if (currentLetterPosition === 0) {
          // Left - show only left letter
          key.classList.add('key-active-left');
          highlightLetter(key, 0);
        } else {
          // Right - show only right letter
          key.classList.add('key-active-right');
          highlightLetter(key, 2);
        }
      }

      // Global mousemove to track movement even when the cursor leaves the key
      document.addEventListener('mousemove', function (e) {
        // Skip if this was triggered by a touch event
        if (touchProcessed) return;
        if (isMouseDown && activeKey) {
          // If we're still in a mouse-down state and have an active key,
          // update the active key based on the gesture, even if the cursor
          // has left the original key element
          updateKeyVisuals(activeKey, e);
        }
      });

      // Global mouseup to ensure swipe gestures end properly
      document.addEventListener('mouseup', function (e) {
        // Skip if this was triggered by a touch event
        if (touchProcessed) return;
        if (isMouseDown && activeKey) {
          // Finish the gesture if we have an active key
          endGesture.call(activeKey, e);
        }
        isMouseDown = false;
        activeKey = null;
        setTimeout(function () {
          resetAllKeys();
        }, 200);
      });
      function startGesture(e) {
        var touch = e.type === 'touchstart' ? e.touches[0] : e;
        startX = touch.clientX;
        startY = touch.clientY;

        // Default to center position initially
        currentLetterPosition = 1;
        this.classList.add('key-active');
        highlightLetter(this, 1);
      }
      function endGesture(e) {
        var key = this;
        var letters = key.getAttribute('data-letters').split('');
        var touch = e.type === 'touchend' ? e.changedTouches[0] : e;

        // Use the currentLetterPosition that's tracked with hysteresis
        // rather than recalculating based on final position
        var selectedLetter;
        var gestureType;
        if (currentLetterPosition === 1) {
          // Center letter
          selectedLetter = letters[1];
          gestureType = 'Tap';
          key.classList.add('key-active');
          highlightLetter(key, 1);
        } else if (currentLetterPosition === 0) {
          // Left letter
          selectedLetter = letters[0];
          gestureType = 'Swipe Left';
          key.classList.add('key-active-left');
          highlightLetter(key, 0);
        } else {
          // Right letter
          selectedLetter = letters[2];
          gestureType = 'Swipe Right';
          key.classList.add('key-active-right');
          highlightLetter(key, 2);
        }

        // Display feedback
        showGestureFeedback("".concat(gestureType, ": ").concat(selectedLetter));

        // Update input
        updateInput(selectedLetter);
      }
      function cancelGesture() {
        this.style.backgroundColor = 'black';
      }
      function updateInput(letter) {
        // Insert the letter always after the text, as per the original prototype
        inputText = inputText + letter;
        inputCursorPosition++;
        updateInputDisplay();
      }
      function updateInputDisplay() {
        textInput.innerHTML = '<span id="text-content">' + inputText + '</span><span id="cursor-input"></span>';
      }
      function showGestureFeedback(text) {
        // Only show feedback for debug reasons
        if (!DEBUG) return;
        gestureDisplay.textContent = text;
        gestureDisplay.style.display = 'block';
        setTimeout(function () {
          gestureDisplay.style.display = 'none';
        }, 1000);
      }

      // Handle clear button
      clearBtn.addEventListener('click', function () {
        inputText = '';
        inputCursorPosition = 0;
        updateInputDisplay();
      });

      // Handle accept button
      acceptBtn.addEventListener('click', function () {
        if (inputText) {
          var currentText = textContent.textContent || '';
          var newText = currentText + inputText;
          textContent.textContent = newText;
          mainCursorPosition += inputText.length;

          // Clear input
          inputText = '';
          inputCursorPosition = 0;
          updateInputDisplay();

          // Update the text area to show cursor at the right position
          updateTextAreaCursor();
        }
      });

      // Modified space button to directly insert space in the main text area
      spaceBtn.addEventListener('click', function () {
        updateInput(" ");
      });

      // Function to update the text area cursor position
      function updateTextAreaCursor() {
        var text = textContent.textContent;
        textArea.innerHTML = '<span id="text-content">' + text + '</span><span id="cursor"></span>';
      }

      // Add touch event handlers for action buttons
      var actionButtons = document.querySelectorAll('.action-button');
      actionButtons.forEach(function (button) {
        button.addEventListener('touchstart', function (e) {
          this.classList.add('action-button-active');
        });
        button.addEventListener('touchend', function () {
          this.classList.remove('action-button-active');
        });
        button.addEventListener('touchcancel', function () {
          this.classList.remove('action-button-active');
        });
      });
    });
  </script>
</body>

</html>

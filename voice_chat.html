<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gemini Audio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap');

* { -webkit-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  background: #f7f6f3;
  color: #1a1917;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-text-size-adjust: none;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

#app {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100%;
  overflow: hidden;
}

/* ── TOPBAR ── */
#topbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: #ffffff;
  border-bottom: 1px solid #e8e6e0;
  overflow: hidden;
}

#brand {
  position: absolute;
  top: 0; left: 12px;
  height: 44px;
  line-height: 44px;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: #6b6760;
  text-transform: uppercase;
}

#topbar-right {
  position: absolute;
  top: 7px; right: 10px;
}

#conn-pill {
  display: inline-block;
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  color: #a8a49e;
  background: #e8e6e0;
  padding: 4px 10px 4px 22px;
  -webkit-border-radius: 100px;
  border-radius: 100px;
  position: relative;
  line-height: 1.4;
  white-space: nowrap;
}

#conn-dot {
  position: absolute;
  left: 9px;
  top: 50%;
  margin-top: -3px;
  width: 6px; height: 6px;
  -webkit-border-radius: 50%;
  border-radius: 50%;
  background: #a8a49e;
}

#conn-pill.ready    { color: #16a34a; background: #f0fdf4; }
#conn-pill.ready    #conn-dot { background: #16a34a; -webkit-animation: blink 2s infinite; animation: blink 2s infinite; }
#conn-pill.speaking { color: #f97316; background: #fff7ed; }
#conn-pill.speaking #conn-dot { background: #f97316; -webkit-animation: blink 0.6s infinite; animation: blink 0.6s infinite; }
#conn-pill.error    { color: #dc2626; background: #fef2f2; }
#conn-pill.error    #conn-dot { background: #dc2626; }

@-webkit-keyframes blink { 0%,100%{opacity:0.4} 50%{opacity:1} }
@keyframes blink { 0%,100%{opacity:0.4} 50%{opacity:1} }

#disc-btn {
  display: none;
  background: none;
  border: 1px solid #d0cdc5;
  color: #6b6760;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  padding: 3px 8px;
  -webkit-border-radius: 100px;
  border-radius: 100px;
  margin-right: 6px;
  vertical-align: middle;
  cursor: pointer;
  -webkit-appearance: none;
}

/* ── COMPAT WARN ── */
#compat-warn {
  display: none;
  position: absolute;
  top: 44px; left: 0; right: 0;
  background: #fef9c3;
  border-bottom: 1px solid #fde047;
  color: #713f12;
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  padding: 5px 12px;
  text-align: center;
}

/* ── SETUP CARD ── */
#setup-card {
  position: absolute;
  top: 54px; left: 10px; right: 10px;
  background: #ffffff;
  border: 1px solid #e8e6e0;
  -webkit-border-radius: 10px;
  border-radius: 10px;
  padding: 14px 14px 10px;
  overflow: hidden;
}

#setup-title {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  color: #a8a49e;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.field { margin-bottom: 8px; }

.field label {
  display: block;
  font-size: 11px;
  color: #a8a49e;
  font-family: 'DM Mono', monospace;
  margin-bottom: 3px;
}

.field input,
.field select {
  display: block;
  width: 100%;
  background: #f7f6f3;
  border: 1px solid #d0cdc5;
  -webkit-border-radius: 7px;
  border-radius: 7px;
  color: #1a1917;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  padding: 8px 10px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  -webkit-box-shadow: none;
  box-shadow: none;
}

.field input:focus,
.field select:focus {
  border-color: #1a1917;
}

.field input::-webkit-input-placeholder { color: #a8a49e; }

#connect-btn {
  display: block;
  width: 100%;
  background: #1a1917;
  color: #f7f6f3;
  border: none;
  -webkit-border-radius: 7px;
  border-radius: 7px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  padding: 10px;
  margin-top: 4px;
  cursor: pointer;
  text-align: center;
  -webkit-appearance: none;
}
#connect-btn:active { opacity: 0.7; }
#connect-btn:disabled { opacity: 0.4; }

/* ── VISUALIZER ── */
#vis-wrap {
  position: absolute;
  left: 0; right: 0;
  text-align: center;
  height: 100px;
}

#vis-ring {
  display: inline-block;
  width: 80px; height: 80px;
  -webkit-border-radius: 50%;
  border-radius: 50%;
  border: 1.5px solid #d0cdc5;
  position: relative;
  background: #ffffff;
}

#vis-ring.speaking {
  border-color: #fb923c;
  -webkit-box-shadow: 0 0 0 5px rgba(251,146,60,0.12), 0 0 0 10px rgba(251,146,60,0.05);
  box-shadow: 0 0 0 5px rgba(251,146,60,0.12), 0 0 0 10px rgba(251,146,60,0.05);
  -webkit-animation: rpulse 1.5s ease-in-out infinite;
  animation: rpulse 1.5s ease-in-out infinite;
}

#vis-ring.thinking { border-color: #d0cdc5; }

@-webkit-keyframes rpulse {
  0%,100%{ -webkit-box-shadow: 0 0 0 4px rgba(251,146,60,0.1), 0 0 0 9px rgba(251,146,60,0.04); }
  50%    { -webkit-box-shadow: 0 0 0 7px rgba(251,146,60,0.16), 0 0 0 14px rgba(251,146,60,0.06); }
}
@keyframes rpulse {
  0%,100%{ box-shadow: 0 0 0 4px rgba(251,146,60,0.1), 0 0 0 9px rgba(251,146,60,0.04); }
  50%    { box-shadow: 0 0 0 7px rgba(251,146,60,0.16), 0 0 0 14px rgba(251,146,60,0.06); }
}

#vis-bars {
  position: absolute;
  width: 50px; height: 30px;
  top: 50%; left: 50%;
  margin-top: -15px;
  margin-left: -25px;
}

.vbar {
  position: absolute;
  bottom: 0;
  width: 4px;
  height: 4px;
  background: #a8a49e;
  -webkit-border-radius: 2px;
  border-radius: 2px;
}

.vbar:nth-child(1) { left: 0px; }
.vbar:nth-child(2) { left: 7px; }
.vbar:nth-child(3) { left: 14px; }
.vbar:nth-child(4) { left: 21px; }
.vbar:nth-child(5) { left: 28px; }
.vbar:nth-child(6) { left: 35px; }
.vbar:nth-child(7) { left: 42px; }

#vis-ring.speaking .vbar { background: #fb923c; }
#vis-ring.speaking .vbar:nth-child(1) { -webkit-animation: vb 1.1s ease-in-out infinite;        animation: vb 1.1s ease-in-out infinite; }
#vis-ring.speaking .vbar:nth-child(2) { -webkit-animation: vb 0.8s ease-in-out infinite 0.1s;   animation: vb 0.8s ease-in-out infinite 0.1s; }
#vis-ring.speaking .vbar:nth-child(3) { -webkit-animation: vb 1.3s ease-in-out infinite 0.05s;  animation: vb 1.3s ease-in-out infinite 0.05s; }
#vis-ring.speaking .vbar:nth-child(4) { -webkit-animation: vb 0.9s ease-in-out infinite 0.15s;  animation: vb 0.9s ease-in-out infinite 0.15s; }
#vis-ring.speaking .vbar:nth-child(5) { -webkit-animation: vb 1.2s ease-in-out infinite 0.08s;  animation: vb 1.2s ease-in-out infinite 0.08s; }
#vis-ring.speaking .vbar:nth-child(6) { -webkit-animation: vb 0.75s ease-in-out infinite 0.2s;  animation: vb 0.75s ease-in-out infinite 0.2s; }
#vis-ring.speaking .vbar:nth-child(7) { -webkit-animation: vb 1.0s ease-in-out infinite 0.12s;  animation: vb 1.0s ease-in-out infinite 0.12s; }

@-webkit-keyframes vb { 0%,100%{height:4px} 50%{height:24px} }
@keyframes vb { 0%,100%{height:4px} 50%{height:24px} }

#vis-ring.thinking .vbar:nth-child(1) { -webkit-animation: tk 1.5s ease-in-out infinite;        animation: tk 1.5s ease-in-out infinite; }
#vis-ring.thinking .vbar:nth-child(2) { -webkit-animation: tk 1.5s ease-in-out infinite 0.2s;   animation: tk 1.5s ease-in-out infinite 0.2s; }
#vis-ring.thinking .vbar:nth-child(3) { -webkit-animation: tk 1.5s ease-in-out infinite 0.4s;   animation: tk 1.5s ease-in-out infinite 0.4s; }
#vis-ring.thinking .vbar:nth-child(4) { -webkit-animation: tk 1.5s ease-in-out infinite 0.6s;   animation: tk 1.5s ease-in-out infinite 0.6s; }
#vis-ring.thinking .vbar:nth-child(5) { -webkit-animation: tk 1.5s ease-in-out infinite 0.4s;   animation: tk 1.5s ease-in-out infinite 0.4s; }
#vis-ring.thinking .vbar:nth-child(6) { -webkit-animation: tk 1.5s ease-in-out infinite 0.2s;   animation: tk 1.5s ease-in-out infinite 0.2s; }
#vis-ring.thinking .vbar:nth-child(7) { -webkit-animation: tk 1.5s ease-in-out infinite;        animation: tk 1.5s ease-in-out infinite; }

@-webkit-keyframes tk { 0%,100%{height:4px} 50%{height:9px} }
@keyframes tk { 0%,100%{height:4px} 50%{height:9px} }

/* ── LOG ── */
#log {
  position: absolute;
  left: 0; right: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 6px 10px;
}

.entry {
  padding: 8px 10px;
  -webkit-border-radius: 7px;
  border-radius: 7px;
  margin-bottom: 6px;
  font-size: 13px;
  line-height: 1.5;
  word-wrap: break-word;
  -webkit-animation: fadeup 0.2s ease both;
  animation: fadeup 0.2s ease both;
}

@-webkit-keyframes fadeup { from{opacity:0;-webkit-transform:translateY(4px)} to{opacity:1;-webkit-transform:translateY(0)} }
@keyframes fadeup { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

.entry.user   { background: #ffffff; border: 1px solid #e8e6e0; margin-left: 28px; }
.entry.gemini { background: #fff8f4; border: 1px solid #fde8d8; margin-right: 28px; color: #7c3415; }
.entry.system {
  background: none; border: none;
  text-align: center;
  font-size: 11px;
  color: #a8a49e;
  font-family: 'DM Mono', monospace;
  padding: 3px 0; margin: 0;
}

.entry-label {
  font-size: 10px;
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  margin-bottom: 3px;
  color: #a8a49e;
}
.entry.gemini .entry-label { color: #f97316; }
.entry.user   .entry-label { color: #2563eb; }

/* ── INPUT AREA ── */
#input-area {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: #ffffff;
  border-top: 1px solid #e8e6e0;
  padding: 8px 10px 14px;
}

#input-row {
  position: relative;
}

#msg-input {
  display: block;
  width: 100%;
  padding: 9px 46px 9px 12px;
  background: #f7f6f3;
  border: 1px solid #d0cdc5;
  -webkit-border-radius: 7px;
  border-radius: 7px;
  color: #1a1917;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  line-height: 1.4;
  outline: none;
  resize: none;
  min-height: 40px;
  max-height: 90px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  -webkit-appearance: none;
  -webkit-box-shadow: none;
  box-shadow: none;
}
#msg-input:focus { border-color: #1a1917; }
#msg-input::-webkit-input-placeholder { color: #a8a49e; }
#msg-input:disabled { opacity: 0.45; }

#send-btn {
  position: absolute;
  right: 5px;
  bottom: 4px;
  width: 34px; height: 34px;
  background: #1a1917;
  color: #f7f6f3;
  border: none;
  -webkit-border-radius: 6px;
  border-radius: 6px;
  font-size: 16px;
  line-height: 34px;
  text-align: center;
  cursor: pointer;
  padding: 0;
  -webkit-appearance: none;
}
#send-btn:active { opacity: 0.7; }
#send-btn:disabled { opacity: 0.3; }

#hint {
  font-size: 10px;
  color: #a8a49e;
  font-family: 'DM Mono', monospace;
  text-align: center;
  margin-top: 5px;
}

#log::-webkit-scrollbar { width: 3px; }
#log::-webkit-scrollbar-track { background: transparent; }
#log::-webkit-scrollbar-thumb { background: #d0cdc5; -webkit-border-radius: 2px; border-radius: 2px; }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <span id="brand">Gemini Audio</span>
    <div id="topbar-right">
      <button id="disc-btn" onclick="disconnect()">disconnect</button><!--
      --><div id="conn-pill"><div id="conn-dot"></div><span id="conn-label">offline</span></div>
    </div>
  </div>

  <div id="compat-warn">&#9888; WebSocket not supported. Voice unavailable on this browser.</div>

  <div id="setup-card">
    <div id="setup-title">Configuration</div>
    <div class="field">
      <label>Gemini API Key</label>
      <input id="key-input" type="password" placeholder="AIza..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    </div>
    <div class="field">
      <label>Voice</label>
      <select id="voice-select">
        <option value="Zephyr">Zephyr (default)</option>
        <option value="Aoede">Aoede</option>
        <option value="Charon">Charon</option>
        <option value="Fenrir">Fenrir</option>
        <option value="Kore">Kore</option>
        <option value="Puck">Puck</option>
      </select>
    </div>
    <div class="field">
      <label>System Prompt (optional)</label>
      <input id="sys-input" type="text" placeholder="You are a helpful assistant." autocorrect="off" autocapitalize="off" />
    </div>
    <button id="connect-btn" onclick="connect()">Connect to Gemini Live</button>
  </div>

  <div id="vis-wrap">
    <div id="vis-ring">
      <div id="vis-bars">
        <div class="vbar"></div><div class="vbar"></div><div class="vbar"></div>
        <div class="vbar"></div><div class="vbar"></div><div class="vbar"></div>
        <div class="vbar"></div>
      </div>
    </div>
  </div>

  <div id="log"></div>

  <div id="input-area">
    <div id="input-row">
      <textarea id="msg-input" rows="1" placeholder="Type your message\u2026" disabled></textarea>
      <button id="send-btn" onclick="sendText()" disabled>&#9658;</button>
    </div>
    <div id="hint">Enter to send &nbsp;&middot;&nbsp; Shift+Enter newline</div>
  </div>

</div>
<script>
// ── Layout (absolute positioning, no flexbox) ────────
function layout() {
  var H = document.documentElement.clientHeight;
  var topH = 44;
  var compatH = (document.getElementById('compat-warn').style.display === 'block') ? 28 : 0;
  var inputH = document.getElementById('input-area').offsetHeight || 72;
  var setupCard = document.getElementById('setup-card');
  var visWrap = document.getElementById('vis-wrap');
  var logEl = document.getElementById('log');

  var setupH = setupCard.style.display !== 'none' ? setupCard.offsetHeight : 0;
  var afterSetup = topH + compatH + (setupH > 0 ? setupH + 10 + 10 : 4);

  visWrap.style.top = afterSetup + 'px';
  var logTop = afterSetup + 100 + 4;
  logEl.style.top = logTop + 'px';
  logEl.style.bottom = inputH + 'px';
}

window.onresize = layout;

// ── State ────────────────────────────────────────────
var ws = null;
var audioCtx = null;
var audioQueue = [];
var isPlaying = false;
var nextPlayTime = 0;
var isConnected = false;
var currentGeminiEntry = null;
var geminiTextBuf = '';
var MODEL = 'models/gemini-2.5-flash-preview-native-audio-dialog';

// ── Compat check ─────────────────────────────────────
if (!window.WebSocket) {
  document.getElementById('compat-warn').style.display = 'block';
  document.getElementById('connect-btn').disabled = true;
}

// ── Status helpers ────────────────────────────────────
function setStatus(cls, label) {
  var pill = document.getElementById('conn-pill');
  pill.className = cls || '';
  pill.id = 'conn-pill';
  document.getElementById('conn-label').textContent = label;
}

function setRing(cls) {
  var r = document.getElementById('vis-ring');
  r.className = cls || '';
  r.id = 'vis-ring';
}

// ── Log helpers ───────────────────────────────────────
function logSystem(msg) {
  var el = document.createElement('div');
  el.className = 'entry system';
  el.textContent = msg;
  var logEl = document.getElementById('log');
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
}

function logUser(text) {
  var logEl = document.getElementById('log');
  var el = document.createElement('div');
  el.className = 'entry user';
  var lb = document.createElement('div');
  lb.className = 'entry-label';
  lb.textContent = 'You';
  var bd = document.createElement('div');
  bd.textContent = text;
  el.appendChild(lb);
  el.appendChild(bd);
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
}

function startGeminiEntry() {
  geminiTextBuf = '';
  var logEl = document.getElementById('log');
  currentGeminiEntry = document.createElement('div');
  currentGeminiEntry.className = 'entry gemini';
  var lb = document.createElement('div');
  lb.className = 'entry-label';
  lb.textContent = 'Gemini';
  var bd = document.createElement('span');
  bd.className = 'body';
  currentGeminiEntry.appendChild(lb);
  currentGeminiEntry.appendChild(bd);
  logEl.appendChild(currentGeminiEntry);
  logEl.scrollTop = logEl.scrollHeight;
}

function appendGeminiText(text) {
  if (!currentGeminiEntry) startGeminiEntry();
  geminiTextBuf += text;
  currentGeminiEntry.querySelector('.body').textContent = geminiTextBuf;
  var logEl = document.getElementById('log');
  logEl.scrollTop = logEl.scrollHeight;
}

function finishGeminiEntry() {
  currentGeminiEntry = null;
  geminiTextBuf = '';
}

// ── Audio ─────────────────────────────────────────────
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function enqueuePCM(b64) {
  ensureAudio();
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) {
    bytes[i] = bin.charCodeAt(i);
  }
  var samples = bytes.length / 2;
  var f32 = new Float32Array(samples);
  var view = new DataView(bytes.buffer);
  for (var j = 0; j < samples; j++) {
    f32[j] = view.getInt16(j * 2, true) / 32768.0;
  }
  var buf = audioCtx.createBuffer(1, f32.length, 24000);
  buf.copyToChannel(f32, 0);
  audioQueue.push(buf);
  if (!isPlaying) drainQueue();
}

function drainQueue() {
  if (audioQueue.length === 0) {
    isPlaying = false;
    setRing('');
    setStatus('ready', 'ready');
    finishGeminiEntry();
    return;
  }
  isPlaying = true;
  setRing('speaking');
  setStatus('speaking', 'speaking');
  var buf = audioQueue.shift();
  var src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  var now = audioCtx.currentTime;
  if (nextPlayTime < now) nextPlayTime = now;
  src.start(nextPlayTime);
  nextPlayTime += buf.duration;
  src.onended = drainQueue;
}

// ── Connect ───────────────────────────────────────────
function connect() {
  var key = document.getElementById('key-input').value;
  if (!key || key.replace(/\s/g, '') === '') { alert('Enter your API key.'); return; }
  key = key.replace(/\s/g, '');

  var voice = document.getElementById('voice-select').value;
  var sysTxt = document.getElementById('sys-input').value;
  if (!sysTxt || sysTxt === '') sysTxt = 'You are a helpful assistant. Respond naturally and conversationally.';

  document.getElementById('connect-btn').disabled = true;
  setStatus('', 'connecting\u2026');

  var url = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=' + key;

  try { ws = new WebSocket(url); }
  catch(e) {
    setStatus('error', 'error');
    logSystem('WebSocket failed: ' + e.message);
    document.getElementById('connect-btn').disabled = false;
    return;
  }

  ws.binaryType = 'arraybuffer';

  ws.onopen = function() {
    var setup = {
      setup: {
        model: MODEL,
        generation_config: {
          response_modalities: ['AUDIO'],
          speech_config: {
            voice_config: {
              prebuilt_voice_config: { voice_name: voice }
            }
          }
        },
        system_instruction: { parts: [{ text: sysTxt }] }
      }
    };
    ws.send(JSON.stringify(setup));
  };

  ws.onmessage = function(evt) {
    var data;
    try { data = JSON.parse(evt.data); } catch(e) { return; }

    if (data.setupComplete !== undefined) {
      isConnected = true;
      setStatus('ready', 'ready');
      document.getElementById('setup-card').style.display = 'none';
      document.getElementById('disc-btn').style.display = 'inline-block';
      document.getElementById('msg-input').disabled = false;
      document.getElementById('send-btn').disabled = false;
      layout();
      document.getElementById('msg-input').focus();
      logSystem('Connected \u2014 type your message below');
      return;
    }

    if (data.serverContent) {
      var sc = data.serverContent;
      if (sc.interrupted) {
        audioQueue = [];
        isPlaying = false;
        nextPlayTime = 0;
        setRing('');
        setStatus('ready', 'ready');
        finishGeminiEntry();
        logSystem('\u2014 interrupted \u2014');
        return;
      }
      if (sc.modelTurn && sc.modelTurn.parts) {
        var parts = sc.modelTurn.parts;
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          if (p.inlineData && p.inlineData.mimeType && p.inlineData.mimeType.indexOf('audio') !== -1) {
            if (!isPlaying) { setRing('thinking'); setStatus('', 'receiving\u2026'); }
            enqueuePCM(p.inlineData.data);
          }
          if (p.text) appendGeminiText(p.text);
        }
      }
    }
  };

  ws.onerror = function() {
    setStatus('error', 'error');
    logSystem('Connection error. Check API key.');
    resetUI();
  };

  ws.onclose = function(evt) {
    if (isConnected) logSystem('Disconnected' + (evt.reason ? ': ' + evt.reason : '.'));
    resetUI();
  };
}

function disconnect() {
  if (ws) { try { ws.close(); } catch(e) {} ws = null; }
  resetUI();
  logSystem('Disconnected.');
}

function resetUI() {
  isConnected = false;
  audioQueue = [];
  isPlaying = false;
  nextPlayTime = 0;
  setRing('');
  setStatus('', 'offline');
  document.getElementById('setup-card').style.display = 'block';
  document.getElementById('disc-btn').style.display = 'none';
  document.getElementById('msg-input').disabled = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('connect-btn').disabled = false;
  layout();
}

// ── Send ──────────────────────────────────────────────
function sendText() {
  if (!isConnected || !ws || ws.readyState !== 1) return;
  var text = document.getElementById('msg-input').value;
  if (!text || text.replace(/\s/g, '') === '') return;
  text = text.replace(/^\s+|\s+$/g, '');

  audioQueue = [];
  isPlaying = false;
  nextPlayTime = 0;
  finishGeminiEntry();

  logUser(text);
  document.getElementById('msg-input').value = '';
  document.getElementById('msg-input').style.height = 'auto';

  setRing('thinking');
  setStatus('', 'thinking\u2026');

  ws.send(JSON.stringify({
    client_content: {
      turns: [{ role: 'user', parts: [{ text: text }] }],
      turn_complete: true
    }
  }));
}

// ── Textarea ──────────────────────────────────────────
var msgInput = document.getElementById('msg-input');

msgInput.onkeydown = function(e) {
  e = e || window.event;
  var key = e.keyCode || e.which;
  if (key === 13 && !e.shiftKey) {
    if (e.preventDefault) { e.preventDefault(); } else { e.returnValue = false; }
    sendText();
  }
};

msgInput.oninput = function() {
  this.style.height = 'auto';
  var h = this.scrollHeight;
  if (h > 90) h = 90;
  this.style.height = h + 'px';
  layout();
};

// ── Init ──────────────────────────────────────────────
setStatus('', 'offline');
layout();
</script>

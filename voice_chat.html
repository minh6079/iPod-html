<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gemini Audio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --border: #e8e6e0;
  --border-strong: #d0cdc5;
  --text: #1a1917;
  --text-2: #6b6760;
  --text-3: #a8a49e;
  --accent: #1a1917;
  --accent-bg: #1a1917;
  --accent-text: #f7f6f3;
  --blue: #2563eb;
  --blue-light: #eff6ff;
  --speaking-1: #fb923c;
  --speaking-2: #f97316;
  --error: #dc2626;
  --error-light: #fef2f2;
  --radius: 12px;
  --radius-sm: 8px;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

#app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 0 16px;
}

/* ── TOP BAR ── */
#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 0 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#brand {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--text-2);
  text-transform: uppercase;
}

#conn-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-family: 'DM Mono', monospace;
  color: var(--text-3);
  background: var(--border);
  padding: 4px 10px;
  border-radius: 100px;
  transition: all 0.2s;
}

#conn-pill.ready   { color: #16a34a; background: #f0fdf4; }
#conn-pill.speaking { color: var(--speaking-2); background: #fff7ed; }
#conn-pill.error   { color: var(--error); background: var(--error-light); }

#conn-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}

#conn-pill.ready   #conn-dot { animation: blink 2s infinite; }
#conn-pill.speaking #conn-dot { animation: blink 0.6s infinite; }

@keyframes blink { 0%,100%{opacity:0.4} 50%{opacity:1} }

/* ── SETUP CARD ── */
#setup-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin: 20px 0 0;
  flex-shrink: 0;
}

#setup-card h2 {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-2);
  margin-bottom: 12px;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.field { margin-bottom: 10px; }
.field label {
  display: block;
  font-size: 12px;
  color: var(--text-3);
  margin-bottom: 4px;
  font-family: 'DM Mono', monospace;
}

.field input, .field select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  padding: 9px 12px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  appearance: none;
  -webkit-appearance: none;
}

.field input:focus, .field select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(26,25,23,0.08);
}

.field input::placeholder { color: var(--text-3); }

#connect-btn {
  width: 100%;
  background: var(--accent-bg);
  color: var(--accent-text);
  border: none;
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  padding: 11px;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  margin-top: 4px;
  letter-spacing: 0.01em;
}

#connect-btn:hover { opacity: 0.85; }
#connect-btn:active { transform: scale(0.99); }
#connect-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── VISUALIZER ── */
#visualizer-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 28px 0 20px;
  flex-shrink: 0;
}

#vis-ring {
  width: 100px; height: 100px;
  border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: border-color 0.3s, box-shadow 0.3s;
  background: var(--surface);
}

#vis-ring.speaking {
  border-color: var(--speaking-1);
  box-shadow: 0 0 0 6px rgba(251,146,60,0.1), 0 0 0 12px rgba(251,146,60,0.05);
  animation: ring-pulse 1.5s ease-in-out infinite;
}

#vis-ring.thinking {
  border-color: var(--border-strong);
  box-shadow: none;
}

@keyframes ring-pulse {
  0%,100% { box-shadow: 0 0 0 4px rgba(251,146,60,0.12), 0 0 0 10px rgba(251,146,60,0.05); }
  50%      { box-shadow: 0 0 0 8px rgba(251,146,60,0.18), 0 0 0 16px rgba(251,146,60,0.06); }
}

#vis-bars {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 36px;
}

.vbar {
  width: 3px;
  background: var(--text-3);
  border-radius: 2px;
  height: 4px;
  transition: background 0.2s;
}

#vis-ring.speaking .vbar { background: var(--speaking-1); }

#vis-ring.speaking .vbar:nth-child(1) { animation: vb 1.1s ease-in-out infinite; }
#vis-ring.speaking .vbar:nth-child(2) { animation: vb 0.8s ease-in-out infinite 0.1s; }
#vis-ring.speaking .vbar:nth-child(3) { animation: vb 1.3s ease-in-out infinite 0.05s; }
#vis-ring.speaking .vbar:nth-child(4) { animation: vb 0.9s ease-in-out infinite 0.15s; }
#vis-ring.speaking .vbar:nth-child(5) { animation: vb 1.2s ease-in-out infinite 0.08s; }
#vis-ring.speaking .vbar:nth-child(6) { animation: vb 0.75s ease-in-out infinite 0.2s; }
#vis-ring.speaking .vbar:nth-child(7) { animation: vb 1.0s ease-in-out infinite 0.12s; }

@keyframes vb { 0%,100%{height:4px} 50%{height:28px} }

#vis-ring.thinking .vbar:nth-child(1) { animation: think 1.5s ease-in-out infinite; }
#vis-ring.thinking .vbar:nth-child(2) { animation: think 1.5s ease-in-out infinite 0.2s; }
#vis-ring.thinking .vbar:nth-child(3) { animation: think 1.5s ease-in-out infinite 0.4s; }
#vis-ring.thinking .vbar:nth-child(4) { animation: think 1.5s ease-in-out infinite 0.6s; }
#vis-ring.thinking .vbar:nth-child(5) { animation: think 1.5s ease-in-out infinite 0.4s; }
#vis-ring.thinking .vbar:nth-child(6) { animation: think 1.5s ease-in-out infinite 0.2s; }
#vis-ring.thinking .vbar:nth-child(7) { animation: think 1.5s ease-in-out infinite; }

@keyframes think { 0%,100%{height:4px} 50%{height:10px} }

/* ── TRANSCRIPT / LOG ── */
#log {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 0 12px;
}

#log:empty::before {
  content: 'Waiting for conversation…';
  display: block;
  text-align: center;
  color: var(--text-3);
  font-size: 13px;
  padding: 24px 0;
  font-family: 'DM Mono', monospace;
}

.entry {
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  font-size: 14px;
  line-height: 1.6;
  animation: fadeup 0.25s ease both;
}

@keyframes fadeup { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

.entry.user {
  background: var(--surface);
  border: 1px solid var(--border);
  margin-left: 32px;
}

.entry.gemini {
  background: #fff8f4;
  border: 1px solid #fde8d8;
  margin-right: 32px;
  color: #7c3415;
}

.entry.system {
  background: transparent;
  border: none;
  text-align: center;
  font-size: 12px;
  color: var(--text-3);
  font-family: 'DM Mono', monospace;
  padding: 4px 0;
  margin: 0;
}

.entry-label {
  font-size: 10px;
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 4px;
  color: var(--text-3);
}

.entry.gemini .entry-label { color: var(--speaking-2); }
.entry.user .entry-label { color: var(--blue); }

/* ── INPUT AREA ── */
#input-area {
  border-top: 1px solid var(--border);
  padding: 12px 0 20px;
  flex-shrink: 0;
}

#input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

#msg-input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  padding: 10px 14px;
  outline: none;
  resize: none;
  min-height: 42px;
  max-height: 100px;
  line-height: 1.5;
  transition: border-color 0.15s, box-shadow 0.15s;
  -webkit-overflow-scrolling: touch;
}

#msg-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(26,25,23,0.07);
}

#msg-input::placeholder { color: var(--text-3); }
#msg-input:disabled { opacity: 0.45; }

#send-btn {
  width: 42px; height: 42px;
  background: var(--accent-bg);
  color: var(--accent-text);
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: opacity 0.15s, transform 0.1s;
}

#send-btn:hover { opacity: 0.8; }
#send-btn:active { transform: scale(0.95); }
#send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

#send-btn svg { width: 18px; height: 18px; fill: currentColor; }

#hint {
  font-size: 11px;
  color: var(--text-3);
  font-family: 'DM Mono', monospace;
  text-align: center;
  margin-top: 8px;
}

/* ── DISCONNECT ── */
#disconnect-btn {
  background: none;
  border: 1px solid var(--border-strong);
  color: var(--text-2);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 100px;
  cursor: pointer;
  display: none;
  transition: all 0.15s;
}
#disconnect-btn:hover { border-color: var(--error); color: var(--error); }

/* scrollbar */
#log::-webkit-scrollbar { width: 3px; }
#log::-webkit-scrollbar-track { background: transparent; }
#log::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div id="topbar">
    <span id="brand">Gemini Audio</span>
    <div style="display:flex;gap:8px;align-items:center;">
      <button id="disconnect-btn" onclick="disconnect()">disconnect</button>
      <div id="conn-pill">
        <div id="conn-dot"></div>
        <span id="conn-label">offline</span>
      </div>
    </div>
  </div>

  <!-- SETUP CARD -->
  <div id="setup-card">
    <h2>Configuration</h2>
    <div class="field">
      <label>Gemini API Key</label>
      <input id="key-input" type="password" placeholder="AIza..." autocomplete="off" spellcheck="false" />
    </div>
    <div class="field">
      <label>Voice</label>
      <select id="voice-select">
        <option value="Zephyr">Zephyr (default)</option>
        <option value="Aoede">Aoede</option>
        <option value="Charon">Charon</option>
        <option value="Fenrir">Fenrir</option>
        <option value="Kore">Kore</option>
        <option value="Puck">Puck</option>
      </select>
    </div>
    <div class="field">
      <label>System Prompt (optional)</label>
      <input id="sys-input" type="text" placeholder="You are a helpful assistant." />
    </div>
    <button id="connect-btn" onclick="connect()">Connect to Gemini Live</button>
  </div>

  <!-- VISUALIZER -->
  <div id="visualizer-wrap">
    <div id="vis-ring">
      <div id="vis-bars">
        <div class="vbar"></div><div class="vbar"></div><div class="vbar"></div>
        <div class="vbar"></div><div class="vbar"></div><div class="vbar"></div>
        <div class="vbar"></div>
      </div>
    </div>
  </div>

  <!-- LOG -->
  <div id="log"></div>

  <!-- INPUT -->
  <div id="input-area">
    <div id="input-row">
      <textarea id="msg-input" placeholder="Type your message… Gemini will reply with voice" rows="1" disabled></textarea>
      <button id="send-btn" onclick="sendText()" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div id="hint">Enter to send &nbsp;·&nbsp; Shift+Enter for newline</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  Gemini 2.5 Flash Native Audio — Multimodal Live API
//  WebSocket: wss://generativelanguage.googleapis.com/ws/
//  Protocol: BidiGenerateContent (JSON over WS)
// ═══════════════════════════════════════════════════════

var ws = null;
var audioCtx = null;
var audioQueue = [];
var isPlaying = false;
var isConnected = false;
var currentGeminiEntry = null;
var geminiTextBuffer = '';

var MODEL = 'models/gemini-2.5-flash-preview-native-audio-dialog';

// ── UI refs ──────────────────────────────────────────
var ring      = document.getElementById('vis-ring');
var connPill  = document.getElementById('conn-pill');
var connLabel = document.getElementById('conn-label');
var logEl     = document.getElementById('log');
var msgInput  = document.getElementById('msg-input');
var sendBtn   = document.getElementById('send-btn');
var setupCard = document.getElementById('setup-card');
var discBtn   = document.getElementById('disconnect-btn');

// ── Status helpers ───────────────────────────────────
function setStatus(state, label) {
  connPill.className = state ? ('conn-pill ' + state) : 'conn-pill';
  connPill.id = 'conn-pill';
  connLabel.textContent = label;
}

function setRing(state) {
  ring.className = state || '';
  ring.id = 'vis-ring';
}

// ── Log helpers ──────────────────────────────────────
function logSystem(msg) {
  var el = document.createElement('div');
  el.className = 'entry system';
  el.textContent = msg;
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
}

function logUser(text) {
  var el = document.createElement('div');
  el.className = 'entry user';
  el.innerHTML = '<div class="entry-label">You</div>' + escHtml(text);
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
}

function startGeminiEntry() {
  geminiTextBuffer = '';
  currentGeminiEntry = document.createElement('div');
  currentGeminiEntry.className = 'entry gemini';
  currentGeminiEntry.innerHTML = '<div class="entry-label">Gemini</div><span class="body"></span>';
  logEl.appendChild(currentGeminiEntry);
  logEl.scrollTop = logEl.scrollHeight;
}

function appendGeminiText(text) {
  if (!currentGeminiEntry) startGeminiEntry();
  geminiTextBuffer += text;
  currentGeminiEntry.querySelector('.body').textContent = geminiTextBuffer;
  logEl.scrollTop = logEl.scrollHeight;
}

function finishGeminiEntry() {
  currentGeminiEntry = null;
  geminiTextBuffer = '';
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Audio ─────────────────────────────────────────────
function ensureAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// PCM16 LE → float32 → AudioBuffer → play in queue
function enqueuePCM(base64Data) {
  ensureAudioCtx();

  var binary = atob(base64Data);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

  // PCM16 little-endian
  var samples = bytes.length / 2;
  var float32 = new Float32Array(samples);
  var view = new DataView(bytes.buffer);
  for (var j = 0; j < samples; j++) {
    var s = view.getInt16(j * 2, true); // little-endian
    float32[j] = s / 32768.0;
  }

  var buffer = audioCtx.createBuffer(1, float32.length, 24000);
  buffer.copyToChannel(float32, 0);
  audioQueue.push(buffer);
  if (!isPlaying) drainAudioQueue();
}

var nextPlayTime = 0;

function drainAudioQueue() {
  if (audioQueue.length === 0) {
    isPlaying = false;
    setRing('');
    setStatus('ready', 'ready');
    finishGeminiEntry();
    return;
  }
  isPlaying = true;
  setRing('speaking');
  setStatus('speaking', 'speaking');

  var buf = audioQueue.shift();
  var src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);

  var now = audioCtx.currentTime;
  if (nextPlayTime < now) nextPlayTime = now;
  src.start(nextPlayTime);
  nextPlayTime += buf.duration;

  src.onended = drainAudioQueue;
}

// ── WebSocket / Gemini Live ───────────────────────────
function connect() {
  var key = document.getElementById('key-input').value.trim();
  if (!key) { alert('Please enter your API key.'); return; }

  var voice = document.getElementById('voice-select').value;
  var sysTxt = document.getElementById('sys-input').value.trim() ||
               'You are a helpful assistant. Respond naturally and conversationally.';

  document.getElementById('connect-btn').disabled = true;
  setStatus('', 'connecting…');

  var url = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=' + key;

  try {
    ws = new WebSocket(url);
  } catch(e) {
    setStatus('error', 'error');
    logSystem('WebSocket not supported in this browser.');
    document.getElementById('connect-btn').disabled = false;
    return;
  }

  ws.binaryType = 'arraybuffer';

  ws.onopen = function() {
    // Send setup message first
    var setup = {
      setup: {
        model: MODEL,
        generation_config: {
          response_modalities: ['AUDIO'],
          speech_config: {
            voice_config: {
              prebuilt_voice_config: { voice_name: voice }
            }
          }
        },
        system_instruction: {
          parts: [{ text: sysTxt }]
        }
      }
    };
    ws.send(JSON.stringify(setup));
  };

  ws.onmessage = function(evt) {
    var data;
    try {
      data = JSON.parse(evt.data);
    } catch(e) { return; }

    // Setup complete
    if (data.setupComplete !== undefined) {
      isConnected = true;
      setStatus('ready', 'ready');
      setupCard.style.display = 'none';
      msgInput.disabled = false;
      sendBtn.disabled = false;
      discBtn.style.display = 'block';
      msgInput.focus();
      logSystem('Connected — type your message below');
      return;
    }

    // Server content (audio + text)
    if (data.serverContent) {
      var sc = data.serverContent;

      // Interrupted
      if (sc.interrupted) {
        audioQueue = [];
        isPlaying = false;
        nextPlayTime = 0;
        setRing('');
        setStatus('ready', 'ready');
        logSystem('— interrupted —');
        finishGeminiEntry();
        return;
      }

      // Model turn parts
      if (sc.modelTurn && sc.modelTurn.parts) {
        var parts = sc.modelTurn.parts;
        for (var i = 0; i < parts.length; i++) {
          var part = parts[i];
          // Audio
          if (part.inlineData && part.inlineData.mimeType &&
              part.inlineData.mimeType.indexOf('audio') !== -1) {
            setRing('thinking');
            setStatus('', 'receiving…');
            enqueuePCM(part.inlineData.data);
          }
          // Text transcript of what Gemini is saying
          if (part.text) {
            appendGeminiText(part.text);
          }
        }
      }

      // Turn complete
      if (sc.turnComplete) {
        // audio will finish playing on its own via drainAudioQueue
      }
    }

    // Tool calls etc — not handled in this minimal UI
  };

  ws.onerror = function() {
    setStatus('error', 'error');
    logSystem('Connection error. Check API key and network.');
    resetUI();
  };

  ws.onclose = function(evt) {
    if (isConnected) {
      logSystem('Disconnected' + (evt.reason ? ': ' + evt.reason : '.'));
    }
    resetUI();
  };
}

function disconnect() {
  if (ws) { ws.close(); ws = null; }
  resetUI();
  logSystem('Disconnected.');
}

function resetUI() {
  isConnected = false;
  audioQueue = [];
  isPlaying = false;
  nextPlayTime = 0;
  setRing('');
  setStatus('', 'offline');
  setupCard.style.display = 'block';
  msgInput.disabled = true;
  sendBtn.disabled = true;
  discBtn.style.display = 'none';
  document.getElementById('connect-btn').disabled = false;
}

// ── Send text ─────────────────────────────────────────
function sendText() {
  if (!isConnected || !ws || ws.readyState !== WebSocket.OPEN) return;
  var text = msgInput.value.trim();
  if (!text) return;

  // Stop any current playback
  audioQueue = [];
  isPlaying = false;
  nextPlayTime = 0;
  finishGeminiEntry();

  logUser(text);
  msgInput.value = '';
  msgInput.style.height = 'auto';

  setRing('thinking');
  setStatus('', 'thinking…');

  var msg = {
    client_content: {
      turns: [
        { role: 'user', parts: [{ text: text }] }
      ],
      turn_complete: true
    }
  };
  ws.send(JSON.stringify(msg));
}

// ── Textarea keyboard ──────────────────────────────────
msgInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendText();
  }
});

msgInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

// ── Init ──────────────────────────────────────────────
setStatus('', 'offline');
</script>
</body>
</html>

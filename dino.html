<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Dino Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f7f7f7;
      font-family: Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #gameContainer {
      max-width: 600px;
      margin: 50px auto 0;
      position: relative;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 150px;
      background: #f7f7f7;
      border: 1px solid #ddd;
    }

    #instructions {
      text-align: center;
      margin: 20px 0;
      font-size: 18px;
      color: #535353;
    }

    #score {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 16px;
      color: #535353;
    }

    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      display: none;
    }

    #gameOver h2 {
      font-size: 24px;
      color: #535353;
      margin-bottom: 10px;
    }

    #restartBtn {
      padding: 10px 20px;
      font-size: 16px;
      background: #535353;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    #restartBtn:hover {
      background: #333;
    }

    @media (max-width: 640px) {
      #gameContainer {
        margin: 20px auto 0;
      }
      
      #instructions {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="score">Score: <span id="scoreValue">0</span></div>
    <div id="gameOver">
      <h2>Game Over!</h2>
      <p>Score: <span id="finalScore">0</span></p>
      <button id="restartBtn">Restart</button>
    </div>
  </div>
  <div id="instructions">Press SPACE or TAP to jump</div>

  <script>
    (function() {
      'use strict';

      // Game configuration
      var config = {
        GRAVITY: 0.5,
        JUMP_VELOCITY: -10,
        SPEED: 4,
        MAX_SPEED: 8,
        ACCELERATION: 0.0005,
        GROUND_Y: 0,
        DINO_WIDTH: 44,
        DINO_HEIGHT: 47,
        CACTUS_WIDTH: 17,
        CACTUS_HEIGHT: 35,
        CLOUD_WIDTH: 46,
        CLOUD_HEIGHT: 14
      };

      // Canvas setup
      var canvas = document.getElementById('gameCanvas');
      var ctx = canvas.getContext('2d');
      var scoreElement = document.getElementById('scoreValue');
      var finalScoreElement = document.getElementById('finalScore');
      var gameOverElement = document.getElementById('gameOver');
      var restartBtn = document.getElementById('restartBtn');

      // Set canvas size
      function resizeCanvas() {
        var container = canvas.parentElement;
        canvas.width = Math.min(600, container.offsetWidth);
        canvas.height = 150;
        config.GROUND_Y = canvas.height - 10;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // Game state
      var game = {
        running: false,
        started: false,
        score: 0,
        speed: config.SPEED,
        frameCount: 0
      };

      // Dino object
      var dino = {
        x: 50,
        y: config.GROUND_Y - config.DINO_HEIGHT,
        width: config.DINO_WIDTH,
        height: config.DINO_HEIGHT,
        velocityY: 0,
        jumping: false,
        
        jump: function() {
          if (!this.jumping) {
            this.velocityY = config.JUMP_VELOCITY;
            this.jumping = true;
          }
        },
        
        update: function() {
          if (this.jumping) {
            this.velocityY += config.GRAVITY;
            this.y += this.velocityY;
            
            if (this.y >= config.GROUND_Y - this.height) {
              this.y = config.GROUND_Y - this.height;
              this.jumping = false;
              this.velocityY = 0;
            }
          }
        },
        
        draw: function() {
          ctx.fillStyle = '#535353';
          
          // Body
          ctx.fillRect(this.x + 6, this.y + 8, 22, 22);
          
          // Head
          ctx.fillRect(this.x + 22, this.y, 16, 16);
          
          // Eye
          ctx.fillStyle = '#fff';
          ctx.fillRect(this.x + 30, this.y + 4, 4, 4);
          
          // Tail
          ctx.fillStyle = '#535353';
          ctx.fillRect(this.x, this.y + 18, 8, 8);
          
          // Arms
          ctx.fillRect(this.x + 10, this.y + 22, 4, 8);
          
          // Legs - animated
          var legOffset = Math.floor(game.frameCount / 6) % 2 === 0 ? 0 : 4;
          ctx.fillRect(this.x + 8, this.y + 30, 6, 17 - legOffset);
          ctx.fillRect(this.x + 20, this.y + 30, 6, 17 + legOffset);
        },
        
        reset: function() {
          this.y = config.GROUND_Y - this.height;
          this.velocityY = 0;
          this.jumping = false;
        }
      };

      // Obstacle manager
      var obstacles = [];
      var lastObstacleFrame = 0;
      
      function createObstacle() {
        var obstacle = {
          x: canvas.width,
          y: config.GROUND_Y - config.CACTUS_HEIGHT,
          width: config.CACTUS_WIDTH,
          height: config.CACTUS_HEIGHT,
          
          update: function() {
            this.x -= game.speed;
          },
          
          draw: function() {
            ctx.fillStyle = '#535353';
            
            // Main cactus body
            ctx.fillRect(this.x + 4, this.y, 9, this.height);
            
            // Left arm
            ctx.fillRect(this.x, this.y + 8, 4, 12);
            ctx.fillRect(this.x, this.y + 8, 6, 4);
            
            // Right arm
            ctx.fillRect(this.x + 13, this.y + 14, 4, 10);
            ctx.fillRect(this.x + 11, this.y + 14, 6, 4);
          },
          
          isOffScreen: function() {
            return this.x + this.width < 0;
          },
          
          collidesWith: function(other) {
            return this.x < other.x + other.width &&
                   this.x + this.width > other.x &&
                   this.y < other.y + other.height &&
                   this.y + this.height > other.y;
          }
        };
        
        obstacles.push(obstacle);
      }

      // Cloud manager
      var clouds = [];
      
      function createCloud() {
        if (clouds.length < 5) {
          var cloud = {
            x: canvas.width,
            y: Math.random() * 50 + 20,
            width: config.CLOUD_WIDTH,
            height: config.CLOUD_HEIGHT,
            
            update: function() {
              this.x -= game.speed * 0.2;
            },
            
            draw: function() {
              ctx.fillStyle = '#d3d3d3';
              ctx.beginPath();
              // Create cloud shape with overlapping circles
              ctx.arc(this.x + 8, this.y + 6, 6, 0, Math.PI * 2);
              ctx.arc(this.x + 16, this.y + 4, 8, 0, Math.PI * 2);
              ctx.arc(this.x + 26, this.y + 5, 7, 0, Math.PI * 2);
              ctx.arc(this.x + 34, this.y + 6, 6, 0, Math.PI * 2);
              ctx.fill();
            },
            
            isOffScreen: function() {
              return this.x + this.width < 0;
            }
          };
          
          clouds.push(cloud);
        }
      }

      // Ground
      function drawGround() {
        ctx.strokeStyle = '#535353';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, config.GROUND_Y);
        ctx.lineTo(canvas.width, config.GROUND_Y);
        ctx.stroke();
        
        // Ground pattern
        var offset = (game.frameCount * game.speed / 4) % 20;
        ctx.strokeStyle = '#aaa';
        ctx.lineWidth = 1;
        for (var i = -offset; i < canvas.width; i += 20) {
          ctx.beginPath();
          ctx.moveTo(i, config.GROUND_Y + 2);
          ctx.lineTo(i + 10, config.GROUND_Y + 2);
          ctx.stroke();
        }
      }

      // Update game
      function update() {
        if (!game.running) return;
        
        game.frameCount++;
        
        // Update speed
        if (game.speed < config.MAX_SPEED) {
          game.speed += config.ACCELERATION;
        }
        
        // Update score
        game.score = Math.floor(game.frameCount / 10);
        scoreElement.textContent = game.score;
        
        // Update dino
        dino.update();
        
        // Spawn obstacles
        if (game.frameCount - lastObstacleFrame > 100 + Math.random() * 80) {
          createObstacle();
          lastObstacleFrame = game.frameCount;
        }
        
        // Spawn clouds
        if (Math.random() < 0.01) {
          createCloud();
        }
        
        // Update obstacles
        for (var i = obstacles.length - 1; i >= 0; i--) {
          obstacles[i].update();
          
          // Check collision
          if (obstacles[i].collidesWith(dino)) {
            gameOver();
            return;
          }
          
          // Remove off-screen obstacles
          if (obstacles[i].isOffScreen()) {
            obstacles.splice(i, 1);
          }
        }
        
        // Update clouds
        for (var j = clouds.length - 1; j >= 0; j--) {
          clouds[j].update();
          
          if (clouds[j].isOffScreen()) {
            clouds.splice(j, 1);
          }
        }
      }

      // Draw game
      function draw() {
        // Clear canvas
        ctx.fillStyle = '#f7f7f7';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Draw clouds
        for (var i = 0; i < clouds.length; i++) {
          clouds[i].draw();
        }
        
        // Draw ground
        drawGround();
        
        // Draw obstacles
        for (var j = 0; j < obstacles.length; j++) {
          obstacles[j].draw();
        }
        
        // Draw dino
        dino.draw();
      }

      // Game loop
      function gameLoop() {
        update();
        draw();
        
        if (game.running) {
          requestAnimationFrame(gameLoop);
        }
      }

      // Start game
      function startGame() {
        game.running = true;
        game.started = true;
        game.score = 0;
        game.speed = config.SPEED;
        game.frameCount = 0;
        gameOverElement.style.display = 'none';
        
        dino.reset();
        obstacles = [];
        clouds = [];
        lastObstacleFrame = 0;
        
        gameLoop();
      }

      // Game over
      function gameOver() {
        game.running = false;
        finalScoreElement.textContent = game.score;
        gameOverElement.style.display = 'block';
      }

      // Input handlers
      function handleJump() {
        if (!game.started) {
          startGame();
        } else if (game.running) {
          dino.jump();
        }
      }

      // Keyboard controls
      document.addEventListener('keydown', function(e) {
        if (e.code === 'Space') {
          e.preventDefault();
          handleJump();
        }
      });

      // Touch controls
      canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        handleJump();
      });

      // Mouse controls
      canvas.addEventListener('click', function() {
        handleJump();
      });

      // Restart button
      restartBtn.addEventListener('click', function() {
        startGame();
      });

      // Initial draw
      draw();
      
    })();
  </script>
</body>
</html>

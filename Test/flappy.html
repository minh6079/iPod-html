<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>flappy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<style>
body { margin:0; overflow:hidden; background:#000; font-family:Helvetica, Arial; }
canvas { display:block; }
#exitBtn { position:absolute; top:10px; left:10px; z-index:10; }
#scoreBadge { position:absolute; top:40px; left:10px; color:#0ff; font-weight:bold; z-index:10; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<a href="index.html" id="exitLink" style="position:absolute;top:10px;left:10px;z-index:10;color:#0ff;font-weight:bold;text-decoration:none;">Back</a>
<div id="scoreBadge"></div>

<script>
var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');
var rafId = null;

function resizeCanvas(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
window.addEventListener('resize', resizeCanvas, false);
resizeCanvas();

var activeGame = null;
var scoreBadge = document.getElementById('scoreBadge');

function startRenderLoop(frameFn){ function loop(){ frameFn(); rafId=requestAnimationFrame(loop); } rafId=requestAnimationFrame(loop); }
function stopGame(){ if(rafId!==null){ cancelAnimationFrame(rafId); rafId=null; } ctx.clearRect(0,0,canvas.width,canvas.height); }
function updateScoreBadge(text){ scoreBadge.innerHTML = text || ''; }

var gameRegistry = {};

/* ---------- GAME CODE ---------- */
gameRegistry.flappy = (function(){ var state={};
    function init(canvas, ctx, startLoop, stopAll, updateScore){
        state.x = 60; state.y = Math.floor(canvas.height/2); state.vy = 0; state.pipes = []; state.frame = 0; state.score = 0;
        updateScore('');
        state.onTap = function(){ state.vy = -8; };
        canvas.addEventListener('touchstart', state.onTap, false);
        function frame(){
            state.vy += 0.5; state.y += state.vy; state.frame++;
            if (state.frame % 90 === 0) { var topH = 40 + Math.floor(Math.random()*(canvas.height-180)); state.pipes.push({x:canvas.width, top:topH, gap:90}); }
            for(var i=state.pipes.length-1;i>=0;i--){ state.pipes[i].x -= 2; if(state.pipes[i].x + 20 < 0) { state.pipes.splice(i,1); state.score++; updateScore('Score: '+state.score); } }
            for(i=0;i<state.pipes.length;i++){ var p=state.pipes[i]; if(state.x+18>p.x && state.x<p.x+20 && (state.y < p.top || state.y+18 > p.top + p.gap)){ state.y = Math.floor(canvas.height/2); state.vy=0; state.pipes=[]; state.score=0; updateScore(''); } }
            if(state.y<0) state.y=0; if(state.y+18>canvas.height) { state.y = Math.floor(canvas.height/2); state.vy = 0; state.pipes=[]; state.score=0; updateScore(''); }
            ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#ff0'; ctx.fillRect(state.x,state.y,18,18);
            ctx.fillStyle='#0f0'; for(i=0;i<state.pipes.length;i++){ var pp=state.pipes[i]; ctx.fillRect(pp.x, 0, 20, pp.top); ctx.fillRect(pp.x, pp.top+pp.gap, 20, canvas.height); }
        }
        state.stop = function(){ canvas.removeEventListener('touchstart', state.onTap, false); };
        startLoop(frame);
    }
    return { init:init, stop:function(){} }; })();

/* Start the game automatically */
if(gameRegistry.flappy){ activeGame = gameRegistry.flappy; activeGame.init(canvas, ctx, startRenderLoop, stopGame, updateScoreBadge); }
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>paint</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<style>
body { margin:0; overflow:hidden; background:#000; font-family:Helvetica, Arial; }
canvas { display:block; }
#exitBtn { position:absolute; top:10px; left:10px; z-index:10; }
#scoreBadge { position:absolute; top:40px; left:10px; color:#0ff; font-weight:bold; z-index:10; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<a href="index.html" id="exitLink" style="position:absolute;top:10px;left:10px;z-index:10;color:#0ff;font-weight:bold;text-decoration:none;">Back</a>
<div id="scoreBadge"></div>

<script>
var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');
var rafId = null;

function resizeCanvas(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
window.addEventListener('resize', resizeCanvas, false);
resizeCanvas();

var activeGame = null;
var scoreBadge = document.getElementById('scoreBadge');

function startRenderLoop(frameFn){ function loop(){ frameFn(); rafId=requestAnimationFrame(loop); } rafId=requestAnimationFrame(loop); }
function stopGame(){ if(rafId!==null){ cancelAnimationFrame(rafId); rafId=null; } ctx.clearRect(0,0,canvas.width,canvas.height); }
function updateScoreBadge(text){ scoreBadge.innerHTML = text || ''; }

var gameRegistry = {};

/* ---------- GAME CODE ---------- */
gameRegistry.paint = (function(){ var state={};
    function init(canvas, ctx, startLoop){
        ctx.lineWidth = 3; ctx.lineCap='round'; ctx.strokeStyle='#32A956';
        state.painting=false;
        state.onStart = function(e){ state.painting=true; var t=e.touches?e.touches[0]:e; ctx.beginPath(); ctx.moveTo(t.clientX, t.clientY); };
        state.onMove = function(e){ if(!state.painting) return; var t=e.touches?e.touches[0]:e; ctx.lineTo(t.clientX, t.clientY); ctx.stroke(); };
        state.onEnd = function(){ state.painting=false; };
        canvas.addEventListener('touchstart', state.onStart, false);
        canvas.addEventListener('touchmove', state.onMove, false);
        canvas.addEventListener('touchend', state.onEnd, false);
        function frame(){ /* idle */ }
        state.stop = function(){ canvas.removeEventListener('touchstart', state.onStart, false); canvas.removeEventListener('touchmove', state.onMove, false); canvas.removeEventListener('touchend', state.onEnd, false); };
        startLoop(frame);
    }
    return { init:init, stop:function(){} }; })();

/* Start the game automatically */
if(gameRegistry.paint){ activeGame = gameRegistry.paint; activeGame.init(canvas, ctx, startRenderLoop, stopGame, updateScoreBadge); }
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>racing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<style>
body { margin:0; overflow:hidden; background:#000; font-family:Helvetica, Arial; }
canvas { display:block; }
#exitBtn { position:absolute; top:10px; left:10px; z-index:10; }
#scoreBadge { position:absolute; top:40px; left:10px; color:#0ff; font-weight:bold; z-index:10; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<a href="index.html" id="exitLink" style="position:absolute;top:10px;left:10px;z-index:10;color:#0ff;font-weight:bold;text-decoration:none;">Back</a>
<div id="scoreBadge"></div>

<script>
var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');
var rafId = null;

function resizeCanvas(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
window.addEventListener('resize', resizeCanvas, false);
resizeCanvas();

var activeGame = null;
var scoreBadge = document.getElementById('scoreBadge');

function startRenderLoop(frameFn){ function loop(){ frameFn(); rafId=requestAnimationFrame(loop); } rafId=requestAnimationFrame(loop); }
function stopGame(){ if(rafId!==null){ cancelAnimationFrame(rafId); rafId=null; } ctx.clearRect(0,0,canvas.width,canvas.height); }
function updateScoreBadge(text){ scoreBadge.innerHTML = text || ''; }

var gameRegistry = {};

/* ---------- GAME CODE ---------- */
gameRegistry.racing = (function(){ var state={};
    function init(canvas, ctx, startLoop, stopAll, updateScore){
        state.carX = canvas.width/2; state.carY = canvas.height - 60; state.speed = 3; state.obstacles = []; state.score = 0; updateScore('');
        state.onMove = function(e){ var t=e.touches?e.touches[0]:e; state.carX = t.clientX; if(state.carX<20) state.carX=20; if(state.carX>canvas.width-20) state.carX=canvas.width-20; };
        canvas.addEventListener('touchmove', state.onMove, false);
        state.spawnTimer = setInterval(function(){ state.obstacles.push({x: Math.random()*(canvas.width-20), y: -10, vy: 2 + Math.random()*2}); }, 700);
        function frame(){
            ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
            // road
            ctx.fillStyle='#333'; ctx.fillRect(30,0, canvas.width-60, canvas.height);
            // car
            ctx.fillStyle='#0f0'; ctx.fillRect(state.carX-10, state.carY, 20, 30);
            // obstacles
            for(var i=state.obstacles.length-1;i>=0;i--){ var o=state.obstacles[i]; o.y += o.vy; ctx.fillStyle='#f00'; ctx.fillRect(o.x,o.y,20,20); if(o.y > canvas.height){ state.obstacles.splice(i,1); state.score++; updateScore('Score: '+state.score); } else if (Math.abs(o.x-state.carX)<20 && Math.abs(o.y-state.carY)<20){ state.obstacles=[]; state.score=0; updateScore(''); } }
        }
        state.stop = function(){ canvas.removeEventListener('touchmove', state.onMove, false); clearInterval(state.spawnTimer); };
        startLoop(frame);
    }
    return { init:init, stop:function(){} }; })();

/* Start the game automatically */
if(gameRegistry.racing){ activeGame = gameRegistry.racing; activeGame.init(canvas, ctx, startRenderLoop, stopGame, updateScoreBadge); }
</script>

</body>
</html>

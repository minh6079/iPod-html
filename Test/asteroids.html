<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>asteroids</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<style>
body { margin:0; overflow:hidden; background:#000; font-family:Helvetica, Arial; }
canvas { display:block; }
#exitBtn { position:absolute; top:10px; left:10px; z-index:10; }
#scoreBadge { position:absolute; top:40px; left:10px; color:#0ff; font-weight:bold; z-index:10; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<a href="index.html" id="exitLink" style="position:absolute;top:10px;left:10px;z-index:10;color:#0ff;font-weight:bold;text-decoration:none;">Back</a>
<div id="scoreBadge"></div>

<script>
var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');
var rafId = null;

function resizeCanvas(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
window.addEventListener('resize', resizeCanvas, false);
resizeCanvas();

var activeGame = null;
var scoreBadge = document.getElementById('scoreBadge');

function startRenderLoop(frameFn){ function loop(){ frameFn(); rafId=requestAnimationFrame(loop); } rafId=requestAnimationFrame(loop); }
function stopGame(){ if(rafId!==null){ cancelAnimationFrame(rafId); rafId=null; } ctx.clearRect(0,0,canvas.width,canvas.height); }
function updateScoreBadge(text){ scoreBadge.innerHTML = text || ''; }

var gameRegistry = {};

/* ---------- GAME CODE ---------- */
gameRegistry.asteroids = (function(){ var state={};
    function init(canvas, ctx, startLoop, stopAll, updateScore){
        state.ship = {x:canvas.width/2, y:canvas.height/2, angle:0};
        state.asteroids = []; state.bullets = []; state.score=0; updateScore('');
        for(var i=0;i<6;i++) state.asteroids.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*2, r:20});
        state.onMove = function(e){ var t=e.touches?e.touches[0]:e; state.ship.x = t.clientX; state.ship.y = t.clientY; };
        canvas.addEventListener('touchmove', state.onMove, false);
        state.onShoot = function(){ state.bullets.push({x:state.ship.x, y:state.ship.y, vy:-4}); };
        canvas.addEventListener('touchstart', state.onShoot, false);
        function frame(){
            for(var i=0;i<state.asteroids.length;i++){ var a=state.asteroids[i]; a.x+=a.vx; a.y+=a.vy; if(a.x<0) a.x=canvas.width; if(a.x>canvas.width) a.x=0; if(a.y<0) a.y=canvas.height; if(a.y>canvas.height) a.y=0;}
            for(i=state.bullets.length-1;i>=0;i--){ state.bullets[i].y += state.bullets[i].vy; if(state.bullets[i].y<0) state.bullets.splice(i,1); }
            // collisions
            for(i=state.asteroids.length-1;i>=0;i--){ for(var j=state.bullets.length-1;j>=0;j--){ var a=state.asteroids[i], b=state.bullets[j]; if(Math.abs(a.x-b.x)<a.r && Math.abs(a.y-b.y)<a.r){ state.asteroids.splice(i,1); state.bullets.splice(j,1); state.score++; updateScore('Score: '+state.score); break; } } }
            ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#fff'; ctx.fillRect(state.ship.x-6, state.ship.y-6, 12, 12);
            ctx.fillStyle='#888'; for(i=0;i<state.asteroids.length;i++){ var a=state.asteroids[i]; ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,Math.PI*2); ctx.fill(); }
            ctx.fillStyle='#ff0'; for(i=0;i<state.bullets.length;i++){ ctx.fillRect(state.bullets[i].x, state.bullets[i].y, 3,6); }
        }
        state.stop = function(){ canvas.removeEventListener('touchmove', state.onMove, false); canvas.removeEventListener('touchstart', state.onShoot, false); };
        startLoop(frame);
    }
    return { init:init, stop:function(){} }; })();

/* Start the game automatically */
if(gameRegistry.asteroids){ activeGame = gameRegistry.asteroids; activeGame.init(canvas, ctx, startRenderLoop, stopGame, updateScoreBadge); }
</script>

</body>
</html>

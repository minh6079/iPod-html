<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>catchgame</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<style>
body { margin:0; overflow:hidden; background:#000; font-family:Helvetica, Arial; }
canvas { display:block; }
#exitBtn { position:absolute; top:10px; left:10px; z-index:10; }
#scoreBadge { position:absolute; top:40px; left:10px; color:#0ff; font-weight:bold; z-index:10; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<a href="index.html" id="exitLink" style="position:absolute;top:10px;left:10px;z-index:10;color:#0ff;font-weight:bold;text-decoration:none;">Back</a>
<div id="scoreBadge"></div>

<script>
var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');
var rafId = null;

function resizeCanvas(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
window.addEventListener('resize', resizeCanvas, false);
resizeCanvas();

var activeGame = null;
var scoreBadge = document.getElementById('scoreBadge');

function startRenderLoop(frameFn){ function loop(){ frameFn(); rafId=requestAnimationFrame(loop); } rafId=requestAnimationFrame(loop); }
function stopGame(){ if(rafId!==null){ cancelAnimationFrame(rafId); rafId=null; } ctx.clearRect(0,0,canvas.width,canvas.height); }
function updateScoreBadge(text){ scoreBadge.innerHTML = text || ''; }

var gameRegistry = {};

/* ---------- GAME CODE ---------- */
gameRegistry.catchgame = (function(){ var state={};
    function init(canvas, ctx, startLoop, stopAll, updateScore){
        state.px = Math.floor(canvas.width/2)-20; state.py = canvas.height - 40; state.objs=[]; state.score = 0; updateScore('');
        state.spawnTimer = setInterval(function(){ state.objs.push({ x: Math.random()*(canvas.width-12), y: -10, vy: 2 + Math.random()*2 }); }, 600);
        state.onMove = function(e){ var t=e.touches?e.touches[0]:e; state.px = t.clientX - 20; if(state.px<0)state.px=0; if(state.px+40>canvas.width)state.px=canvas.width-40; };
        canvas.addEventListener('touchmove', state.onMove, false);
        function frame(){ ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#0f0'; ctx.fillRect(state.px,state.py,40,12); for(var i=state.objs.length-1;i>=0;i--){ var o=state.objs[i]; o.y += o.vy; ctx.fillStyle='#f00'; ctx.fillRect(o.x,o.y,12,12); if(o.y + 12 > state.py && o.x > state.px && o.x < state.px + 40){ state.objs.splice(i,1); state.score++; updateScore('Score: '+state.score); } else if (o.y > canvas.height + 20) state.objs.splice(i,1); } }
        state.stop = function(){ clearInterval(state.spawnTimer); canvas.removeEventListener('touchmove', state.onMove, false); };
        startLoop(frame);
    }
    return { init:init, stop:function(){} }; })();

/* Start the game automatically */
if(gameRegistry.catchgame){ activeGame = gameRegistry.catchgame; activeGame.init(canvas, ctx, startRenderLoop, stopGame, updateScoreBadge); }
</script>

</body>
</html>

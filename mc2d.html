<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=320, height=480, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>MiniCraft iPod</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 320px;
  height: 480px;
  overflow: hidden;
  background: #000;
  font-family: Helvetica, Arial, sans-serif;
}

/* Game container */
#game {
  position: relative;
  width: 320px;
  height: 480px;
  overflow: hidden;
  background: #6db3f2;
}

/* Canvas */
canvas {
  display: block;
  width: 320px;
  height: 400px;
  background: #87ceeb;
}

/* Inventory bar */
.inventory {
  position: absolute;
  bottom: 6px;
  left: 50%;
  width: 300px;
  margin-left: -150px;

  text-align: center;
  white-space: nowrap;
}

.inv-slot {
  display: inline-block;
  width: 28px;
  height: 28px;
  margin: 1px;

  background: #333;
  border: 1px solid #111;
}

.inv-slot.selected {
  border-color: #fff;
}

/* Action buttons */
.action-btn {
  position: absolute;

  width: 36px;
  height: 36px;

  font-size: 11px;
  line-height: 36px;
  text-align: center;

  padding: 0;
  margin: 0;

  background: #555;
  color: #fff;
  border: 1px solid #222;
  border-radius: 6px;

  -webkit-appearance: none;
}

.action-btn:active {
  background: #333;
}

#breakBtn {
  right: 6px;
  bottom: 64px;
}

#placeBtn {
  right: 6px;
  bottom: 104px;
}
</style>
</head>

<body>
<div id="game">
  <canvas id="canvas" width="320" height="400"></canvas>

  <button id="breakBtn" class="action-btn">Break</button>
  <button id="placeBtn" class="action-btn">Place</button>

  <div id="inventory" class="inventory"></div>
</div>

<script>
(function () {

/* ===== Canvas ===== */
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');

/* ===== World ===== */
var TILE = 20;
var COLS = 16;
var ROWS = 20;

var world = [];
for (var y = 0; y < ROWS; y++) {
  world[y] = [];
  for (var x = 0; x < COLS; x++) {
    world[y][x] = (y > 12) ? 1 : 0;
  }
}

/* ===== Inventory ===== */
var inventory = [1, 1, 1, 1, 1, 1, 1];
var selectedSlot = 0;
var selectedBlock = 1;

var invDiv = document.getElementById('inventory');

function createInventory() {
  invDiv.innerHTML = '';
  for (var i = 0; i < inventory.length; i++) {
    var slot = document.createElement('div');
    slot.className = 'inv-slot' + (i === 0 ? ' selected' : '');
    slot.setAttribute('data-index', i);

    slot.addEventListener('touchstart', function (e) {
      e.preventDefault();
      var idx = parseInt(this.getAttribute('data-index'), 10);
      selectSlot(idx);
    }, false);

    invDiv.appendChild(slot);
  }
}

function selectSlot(i) {
  selectedSlot = i;
  selectedBlock = inventory[i];

  var slots = invDiv.getElementsByClassName('inv-slot');
  for (var j = 0; j < slots.length; j++) {
    slots[j].className = 'inv-slot';
  }
  slots[i].className = 'inv-slot selected';
}

/* ===== Touch helpers ===== */
function getTouchPos(e) {
  var rect = canvas.getBoundingClientRect();
  var t = e.touches[0];
  return {
    x: Math.floor((t.clientX - rect.left) * (canvas.width / rect.width)),
    y: Math.floor((t.clientY - rect.top) * (canvas.height / rect.height))
  };
}

/* ===== Block actions ===== */
function breakBlock(x, y) {
  var gx = Math.floor(x / TILE);
  var gy = Math.floor(y / TILE);
  if (world[gy] && world[gy][gx]) world[gy][gx] = 0;
}

function placeBlock(x, y) {
  var gx = Math.floor(x / TILE);
  var gy = Math.floor(y / TILE);
  if (world[gy] && !world[gy][gx]) world[gy][gx] = selectedBlock;
}

/* ===== Buttons ===== */
document.getElementById('breakBtn').addEventListener('touchstart', function (e) {
  e.preventDefault();
  canvas._mode = 'break';
}, false);

document.getElementById('placeBtn').addEventListener('touchstart', function (e) {
  e.preventDefault();
  canvas._mode = 'place';
}, false);

/* ===== Canvas touch ===== */
canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  var p = getTouchPos(e);
  if (canvas._mode === 'break') breakBlock(p.x, p.y);
  else placeBlock(p.x, p.y);
}, false);

/* ===== Render ===== */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (var y = 0; y < ROWS; y++) {
    for (var x = 0; x < COLS; x++) {
      if (world[y][x]) {
        ctx.fillStyle = '#654321';
        ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
      }
    }
  }
}

function loop() {
  draw();
  setTimeout(loop, 16);
}

/* ===== Init ===== */
createInventory();
loop();

})();
</script>
</body>
</html>

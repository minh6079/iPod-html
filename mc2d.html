<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2D Minecraft ES5</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-webkit-touch-callout:none;}
body{background:#000;overflow:hidden;font-family:Arial,"Apple Color Emoji",sans-serif;}
canvas{display:block;position:absolute;top:0;left:0;background:#87CEEB;-webkit-image-rendering:optimize-contrast;image-rendering:pixelated;}

#ui-container{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:100;}

#top-bar{
  position:absolute;
  top:0;left:0;right:0;
  height:60px;
  background:linear-gradient(to bottom,rgba(0,0,0,0.6),rgba(0,0,0,0));
  padding:8px;
}

#inventory{
  white-space:nowrap;
  pointer-events:auto;
}

.inv-slot{
  display:inline-block;
  width:44px;
  height:44px;
  margin-right:4px;
  border:3px solid rgba(255,255,255,0.4);
  border-radius:4px;
  background:rgba(0,0,0,0.5);
  vertical-align:top;
}

.inv-slot.selected{
  border-color:#fff;
  background:rgba(255,255,255,0.3);
}

#mode-indicator{
  position:absolute;
  right:8px;
  top:8px;
  padding:6px 10px;
  font-size:14px;
  border-radius:6px;
  color:#fff;
  background:rgba(200,50,50,0.8);
  border:2px solid rgba(255,255,255,0.5);
  pointer-events:auto;
  text-align:center;
}

.place-mode{background:rgba(50,150,50,0.8)!important;}

#controls{
  position:absolute;
  bottom:0;left:0;right:0;
  height:120px;
  pointer-events:none;
}

.btn{
  position:absolute;
  width:48px;
  height:48px;
  font-size:24px;
  line-height:48px;
  padding:0;margin:0;
  -webkit-appearance:none;
  display:block;
  background:rgba(255,255,255,0.3);
  border:3px solid rgba(255,255,255,0.6);
  border-radius:10px;
  color:#fff;
  text-align:center;
  pointer-events:auto;
}

#leftBtn{left:12px;bottom:20px;}
#rightBtn{left:68px;bottom:20px;}
#jumpBtn{
  right:12px;
  bottom:16px;
  width:64px;
  height:64px;
  font-size:32px;
}

#reach-indicator{position:absolute;left:50%;top:50%;width:8px;height:8px;margin-left:-4px;margin-top:-4px;pointer-events:none;}
#reach-indicator::before,#reach-indicator::after{content:'';position:absolute;background:rgba(255,255,255,0.8);}
#reach-indicator::before{left:0;top:3px;width:8px;height:2px;}
#reach-indicator::after{left:3px;top:0;width:2px;height:8px;}
</style>
</head>

<body>
<canvas id="gameCanvas"></canvas>

<div id="ui-container">
  <div id="top-bar">
    <div id="inventory"></div>
    <div id="mode-indicator">⛏ MINE</div>
  </div>

  <div id="reach-indicator"></div>

  <div id="controls">
    <div class="btn" id="leftBtn">◄</div>
    <div class="btn" id="rightBtn">►</div>
    <div class="btn" id="jumpBtn">▲</div>
  </div>
</div>

<script>
(function(){
var canvas=document.getElementById('gameCanvas');
var ctx=canvas.getContext('2d');

function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

/* Helper: convert touch to canvas coordinates */
function getTouchPos(t){
  var r=canvas.getBoundingClientRect();
  return{
    x:(t.clientX-r.left)*(canvas.width/r.width),
    y:(t.clientY-r.top)*(canvas.height/r.height)
  };
}

/* --- Game variables --- */
var BLOCK_SIZE=20,WORLD_WIDTH=120,WORLD_HEIGHT=60,GRAVITY=0.8,JUMP_POWER=-13,MOVE_SPEED=4,MAX_REACH=5,MAX_FALL_SPEED=15;
var BLOCKS={AIR:0,GRASS:1,DIRT:2,STONE:3,WOOD:4,LEAVES:5,PLANKS:6,SAND:7,COBBLESTONE:8};
var BLOCK_COLORS={};
BLOCK_COLORS[BLOCKS.GRASS]=['#7CBD3C','#5FA127','#4A8118'];
BLOCK_COLORS[BLOCKS.DIRT]=['#8B6914','#6B4910','#4A3008'];
BLOCK_COLORS[BLOCKS.STONE]=['#888','#666','#444'];
BLOCK_COLORS[BLOCKS.WOOD]=['#8B4513','#6B3410','#4A2008'];
BLOCK_COLORS[BLOCKS.LEAVES]=['#228B22','#1A6B1A','#0F4D0F'];
BLOCK_COLORS[BLOCKS.PLANKS]=['#DEB887','#BF9870','#9F7850'];
BLOCK_COLORS[BLOCKS.SAND]=['#F4E4C1','#D4C4A1','#B4A481'];
BLOCK_COLORS[BLOCKS.COBBLESTONE]=['#7A7A7A','#5A5A5A','#3A3A3A'];

var world=[],player={x:60*BLOCK_SIZE,y:20*BLOCK_SIZE,width:14,height:30,vx:0,vy:0,onGround:false};
var camera={x:0,y:0};
var keys={left:false,right:false,jump:false,jumpPressed:false};
var mode='mine',selectedBlock=BLOCKS.DIRT,inventory=[BLOCKS.GRASS,BLOCKS.DIRT,BLOCKS.STONE,BLOCKS.WOOD,BLOCKS.PLANKS,BLOCKS.COBBLESTONE,BLOCKS.SAND],selectedSlot=0;

/* --- World generation --- */
function initWorld(){
for(var x=0;x<WORLD_WIDTH;x++){world[x]=[];for(var y=0;y<WORLD_HEIGHT;y++){world[x][y]=BLOCKS.AIR;}}
for(var x=0;x<WORLD_WIDTH;x++){
var height=Math.floor(WORLD_HEIGHT/2+Math.sin(x*0.08)*6+Math.cos(x*0.04)*4);
for(var y=height;y<WORLD_HEIGHT;y++){if(y===height){world[x][y]=BLOCKS.GRASS;}else if(y<height+4){world[x][y]=BLOCKS.DIRT;}else{world[x][y]=BLOCKS.STONE;}}
if(Math.random()<0.08 && x< WORLD_WIDTH-4 && x>3){var th=5+Math.floor(Math.random()*4);for(var ty=0;ty<th;ty++){if(height-ty-1>=0){world[x][height-ty-1]=BLOCKS.WOOD;}}
for(var lx=-2;lx<=2;lx++){for(var ly=-2;ly<=1;ly++){var tx=x+lx;var ty=height-th+ly;if(tx>=0 && tx<WORLD_WIDTH && ty>=0 && ty<WORLD_HEIGHT){if((Math.abs(lx)+Math.abs(ly)<4) && world[tx][ty]===BLOCKS.AIR){world[tx][ty]=BLOCKS.LEAVES;}}}}}}
for(var x=0;x<10;x++){for(var y=0;y<WORLD_HEIGHT;y++){if(world[x][y]===BLOCKS.GRASS || world[x][y]===BLOCKS.DIRT){world[x][y]=BLOCKS.SAND;}}}
}
initWorld();

/* --- Player physics, camera, collisions --- */
// ... (use your existing functions: drawBlock, drawPlayer, updatePlayer, updateCamera, checkCollision, render, gameLoop, etc.)

/* --- Touch handling for break/place --- */
function handleTouch(x,y){
  var wx=Math.floor((x+camera.x)/BLOCK_SIZE);
  var wy=Math.floor((y+camera.y)/BLOCK_SIZE);
  if(wx>=0 && wx<WORLD_WIDTH && wy>=0 && wy<WORLD_HEIGHT){
    var px=player.x+player.width/2, py=player.y+player.height/2;
    var bx=wx*BLOCK_SIZE+BLOCK_SIZE/2, by=wy*BLOCK_SIZE+BLOCK_SIZE/2;
    if(Math.abs(px-bx)<BLOCK_SIZE*MAX_REACH && Math.abs(py-by)<BLOCK_SIZE*MAX_REACH){
      if(mode==='mine'){ if(world[wx][wy]!==BLOCKS.AIR) world[wx][wy]=BLOCKS.AIR; }
      else{
        var pl=Math.floor(player.x/BLOCK_SIZE),pr=Math.floor((player.x+player.width-1)/BLOCK_SIZE);
        var pt=Math.floor(player.y/BLOCK_SIZE),pb=Math.floor((player.y+player.height-1)/BLOCK_SIZE);
        if(!(wx>=pl && wx<=pr && wy>=pt && wy<=pb)){ world[wx][wy]=selectedBlock; }
      }
    }
  }
}

/* --- Touch event listeners --- */
var isTouching=false;
canvas.addEventListener('touchstart',function(e){e.preventDefault();isTouching=true; handleTouch(getTouchPos(e.touches[0]).x,getTouchPos(e.touches[0]).y);});
canvas.addEventListener('touchmove',function(e){e.preventDefault(); if(isTouching){ handleTouch(getTouchPos(e.touches[0]).x,getTouchPos(e.touches[0]).y); }});
canvas.addEventListener('touchend',function(e){e.preventDefault(); isTouching=false;});

/* --- Buttons --- */
function addButtonEvents(id,key){var btn=document.getElementById(id);btn.addEventListener('touchstart',function(e){e.preventDefault();keys[key]=true;});btn.addEventListener('touchend',function(e){e.preventDefault();keys[key]=false;});}
addButtonEvents('leftBtn','left');addButtonEvents('rightBtn','right');addButtonEvents('jumpBtn','jump');

var modeBtn=document.getElementById('mode-indicator');
modeBtn.addEventListener('touchstart',function(e){e.preventDefault();mode=mode==='mine'?'place':'mine';this.textContent=mode==='mine'?'⛏ MINE':'⬜ PLACE';this.className=mode==='mine'?'mine-mode':'place-mode';});

/* --- Inventory --- */
function createInventory(){
var invDiv=document.getElementById('inventory');
for(var i=0;i<inventory.length;i++){
  var slot=document.createElement('div'); slot.className='inv-slot'; if(i===selectedSlot) slot.className+=' selected';
  var blockCanvas=document.createElement('canvas'); blockCanvas.width=40; blockCanvas.height=40;
  var blockCtx=blockCanvas.getContext('2d'); var bt=inventory[i]; var colors=BLOCK_COLORS[bt];
  if(colors){blockCtx.fillStyle=colors[0]; blockCtx.fillRect(0,0,40,40); if(bt===BLOCKS.GRASS){blockCtx.fillStyle=BLOCK_COLORS[BLOCKS.DIRT][0]; blockCtx.fillRect(0,8,40,32);} blockCtx.fillStyle=colors[1]; blockCtx.fillRect(0,36,40,4); blockCtx.fillRect(36,0,4,40); blockCtx.fillStyle='rgba(255,255,255,0.3)'; blockCtx.fillRect(0,0,40,3); blockCtx.fillRect(0,0,3,40);}
  slot.appendChild(blockCanvas);
  slot.setAttribute('data-index',i);
  slot.addEventListener('touchstart',function(e){e.preventDefault();var idx=parseInt(this.getAttribute('data-index'),10);selectedSlot=idx;selectedBlock=inventory[idx]; var slots=invDiv.getElementsByClassName('inv-slot'); for(var j=0;j<slots.length;j++){slots[j].className='inv-slot';}this.className='inv-slot selected';});
  invDiv.appendChild(slot);
}}
createInventory();

/* --- Start game loop --- */
gameLoop();

})();
</script>
</body>
</html>

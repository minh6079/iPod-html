<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2D Minecraft ES5</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-webkit-touch-callout:none;}
body{background:#000;overflow:hidden;font-family:Arial,sans-serif;}
canvas{display:block;position:absolute;top:0;left:0;background:#87CEEB;-webkit-image-rendering: optimize-contrast; image-rendering: pixelated;}
#ui-container{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:100;}
#top-bar{position:absolute;top:0;left:0;right:0;height:60px;background:linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0));display:flex;justify-content:space-between;align-items:flex-start;padding:8px;}
#inventory{display:flex;gap:4px;pointer-events:auto;}
.inv-slot{width:44px;height:44px;border:3px solid rgba(255,255,255,0.4);border-radius:4px;background:rgba(0,0,0,0.5);position:relative;cursor:pointer;}
.inv-slot.selected{border-color:#fff;background:rgba(255,255,255,0.3);box-shadow:0 0 10px rgba(255,255,255,0.5);}
.inv-slot canvas{width:100%;height:100%;display:block;}
#mode-indicator{pointer-events:auto;padding:8px 14px;background:rgba(0,0,0,0.7);color:#fff;border:2px solid rgba(255,255,255,0.5);border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer;}
#mode-indicator.mine-mode{background:rgba(200,50,50,0.8);border-color:#ff6b6b;}
#mode-indicator.place-mode{background:rgba(50,150,50,0.8);border-color:#6bff6b;}
#controls{position:absolute;bottom:0;left:0;right:0;height:140px;background:linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0));pointer-events:none;}
.btn{position:absolute;background:rgba(255,255,255,0.3);border:3px solid rgba(255,255,255,0.6);border-radius:10px;font-size:28px;color:white;text-align:center;font-weight:bold;pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.btn:active{background:rgba(255,255,255,0.6);-webkit-transform:scale(0.95);}
#leftBtn,#rightBtn{width:70px;height:70px;bottom:30px;}
#leftBtn{left:15px;}#rightBtn{left:95px;}
#jumpBtn{right:15px;bottom:30px;width:90px;height:90px;font-size:36px;background:rgba(255,200,50,0.4);border-color:rgba(255,220,100,0.8);}
#jumpBtn:active{background:rgba(255,220,100,0.7);}
#reach-indicator{position:absolute;left:50%;top:50%;width:8px;height:8px;margin-left:-4px;margin-top:-4px;pointer-events:none;}
#reach-indicator::before,#reach-indicator::after{content:'';position:absolute;background:rgba(255,255,255,0.8);}
#reach-indicator::before{left:0;top:3px;width:8px;height:2px;}
#reach-indicator::after{left:3px;top:0;width:2px;height:8px;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui-container">
  <div id="top-bar">
    <div id="inventory"></div>
    <div id="mode-indicator" class="mine-mode">⛏ MINE</div>
  </div>
  <div id="reach-indicator"></div>
  <div id="controls">
    <div class="btn" id="leftBtn">◄</div>
    <div class="btn" id="rightBtn">►</div>
    <div class="btn" id="jumpBtn">▲</div>
  </div>
</div>

<script>
(function(){
var canvas=document.getElementById('gameCanvas');
var ctx=canvas.getContext('2d');
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resizeCanvas();

var BLOCK_SIZE=20,WORLD_WIDTH=120,WORLD_HEIGHT=60,GRAVITY=0.8,JUMP_POWER=-13,MOVE_SPEED=4,MAX_REACH=5,MAX_FALL_SPEED=15;
var BLOCKS={AIR:0,GRASS:1,DIRT:2,STONE:3,WOOD:4,LEAVES:5,PLANKS:6,SAND:7,COBBLESTONE:8};
var BLOCK_COLORS={};
BLOCK_COLORS[BLOCKS.GRASS]=['#7CBD3C','#5FA127','#4A8118'];
BLOCK_COLORS[BLOCKS.DIRT]=['#8B6914','#6B4910','#4A3008'];
BLOCK_COLORS[BLOCKS.STONE]=['#888','#666','#444'];
BLOCK_COLORS[BLOCKS.WOOD]=['#8B4513','#6B3410','#4A2008'];
BLOCK_COLORS[BLOCKS.LEAVES]=['#228B22','#1A6B1A','#0F4D0F'];
BLOCK_COLORS[BLOCKS.PLANKS]=['#DEB887','#BF9870','#9F7850'];
BLOCK_COLORS[BLOCKS.SAND]=['#F4E4C1','#D4C4A1','#B4A481'];
BLOCK_COLORS[BLOCKS.COBBLESTONE]=['#7A7A7A','#5A5A5A','#3A3A3A'];

var world=[],player={x:60*BLOCK_SIZE,y:20*BLOCK_SIZE,width:14,height:30,vx:0,vy:0,onGround:false};
var camera={x:0,y:0};
var keys={left:false,right:false,jump:false,jumpPressed:false};
var mode='mine',selectedBlock=BLOCKS.DIRT,inventory=[BLOCKS.GRASS,BLOCKS.DIRT,BLOCKS.STONE,BLOCKS.WOOD,BLOCKS.PLANKS,BLOCKS.COBBLESTONE,BLOCKS.SAND],selectedSlot=0;

function initWorld(){
for(var x=0;x<WORLD_WIDTH;x++){world[x]=[];for(var y=0;y<WORLD_HEIGHT;y++){world[x][y]=BLOCKS.AIR;}}
for(var x=0;x<WORLD_WIDTH;x++){
var height=Math.floor(WORLD_HEIGHT/2+Math.sin(x*0.08)*6+Math.cos(x*0.04)*4);
for(var y=height;y<WORLD_HEIGHT;y++){if(y===height){world[x][y]=BLOCKS.GRASS;}else if(y<height+4){world[x][y]=BLOCKS.DIRT;}else{world[x][y]=BLOCKS.STONE;}}
if(Math.random()<0.08 && x< WORLD_WIDTH-4 && x>3){var th=5+Math.floor(Math.random()*4);for(var ty=0;ty<th;ty++){if(height-ty-1>=0){world[x][height-ty-1]=BLOCKS.WOOD;}}
for(var lx=-2;lx<=2;lx++){for(var ly=-2;ly<=1;ly++){var tx=x+lx;var ty=height-th+ly;if(tx>=0 && tx<WORLD_WIDTH && ty>=0 && ty<WORLD_HEIGHT){if((Math.abs(lx)+Math.abs(ly)<4) && world[tx][ty]===BLOCKS.AIR){world[tx][ty]=BLOCKS.LEAVES;}}}}}}
for(var x=0;x<10;x++){for(var y=0;y<WORLD_HEIGHT;y++){if(world[x][y]===BLOCKS.GRASS || world[x][y]===BLOCKS.DIRT){world[x][y]=BLOCKS.SAND;}}}
}

function drawBlock(x,y,t){if(t===BLOCKS.AIR)return;var colors=BLOCK_COLORS[t];if(!colors)return;var sx=Math.floor(x*BLOCK_SIZE-camera.x);var sy=Math.floor(y*BLOCK_SIZE-camera.y);
ctx.fillStyle=colors[0];ctx.fillRect(sx,sy,BLOCK_SIZE,BLOCK_SIZE);
if(t===BLOCKS.GRASS){ctx.fillStyle=BLOCK_COLORS[BLOCKS.DIRT][0];ctx.fillRect(sx,sy+4,BLOCK_SIZE,BLOCK_SIZE-4);}
ctx.fillStyle=colors[1];ctx.fillRect(sx,sy+BLOCK_SIZE-3,BLOCK_SIZE,3);ctx.fillRect(sx+BLOCK_SIZE-3,sy,3,BLOCK_SIZE);
ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillRect(sx,sy,2,BLOCK_SIZE);ctx.fillRect(sx,sy,8,2);
ctx.fillStyle=colors[2];ctx.fillRect(sx+BLOCK_SIZE-2,sy+BLOCK_SIZE-2,2,2);
}

function drawPlayer(){var sx=Math.floor(player.x-camera.x);var sy=Math.floor(player.y-camera.y);
ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(sx-2,sy+player.height,player.width+4,2);
ctx.fillStyle='#3A7BC8';ctx.fillRect(sx+1,sy+9,player.width-2,13);
ctx.fillStyle='#2C5FA0';ctx.fillRect(sx+player.width-3,sy+9,2,13);
ctx.fillStyle='#F5D7B8';ctx.fillRect(sx+2,sy,player.width-4,9);
ctx.fillStyle='#D4B798';ctx.fillRect(sx+player.width-4,sy,2,9);
ctx.fillStyle='#000';ctx.fillRect(sx+4,sy+3,2,2);ctx.fillRect(sx+8,sy+3,2,2);
ctx.fillStyle='#1A3E6E';ctx.fillRect(sx+2,sy+22,4,8);ctx.fillRect(sx+8,sy+22,4,8);
ctx.fillStyle='#3A7BC8';ctx.fillRect(sx-1,sy+10,2,9);ctx.fillRect(sx+player.width-1,sy+10,2,9);
}

function updateCamera(){var tx=player.x-canvas.width/2+player.width/2;var ty=player.y-canvas.height/2+player.height/2;
tx=Math.max(0,Math.min(tx,WORLD_WIDTH*BLOCK_SIZE-canvas.width));
ty=Math.max(0,Math.min(ty,WORLD_HEIGHT*BLOCK_SIZE-canvas.height));
camera.x+= (tx-camera.x)*0.1;camera.y+=(ty-camera.y)*0.1;
}

function checkCollision(x,y,w,h){var left=Math.floor(x/BLOCK_SIZE),right=Math.floor((x+w-0.1)/BLOCK_SIZE),top=Math.floor(y/BLOCK_SIZE),bottom=Math.floor((y+h-0.1)/BLOCK_SIZE);
for(var bx=left;bx<=right;bx++){for(var by=top;by<=bottom;by++){if(bx>=0 && bx<WORLD_WIDTH && by>=0 && by<WORLD_HEIGHT){if(world[bx][by]!==BLOCKS.AIR){return true;}}else if(by>=WORLD_HEIGHT){return true;}}}return false;}

function updatePlayer(){if(keys.left){player.vx=-MOVE_SPEED;}else if(keys.right){player.vx=MOVE_SPEED;}else{player.vx=0;}
if(keys.jump && player.onGround && !keys.jumpPressed){player.vy=JUMP_POWER;player.onGround=false;keys.jumpPressed=true;}
if(!keys.jump){keys.jumpPressed=false;}
if(!player.onGround){player.vy+=GRAVITY;if(player.vy>MAX_FALL_SPEED){player.vy=MAX_FALL_SPEED;}}else if(player.vy>0){player.vy=0;}

var oldX=player.x;player.x+=player.vx;if(checkCollision(player.x,player.y,player.width,player.height)){player.x=oldX;player.vx=0;}
if(player.x<0){player.x=0;player.vx=0;}if(player.x>WORLD_WIDTH*BLOCK_SIZE-player.width){player.x=WORLD_WIDTH*BLOCK_SIZE-player.width;player.vx=0;}

var oldY=player.y;player.y+=player.vy;if(player.y<0){player.y=0;player.vy=0;}
if(player.vy>0){if(checkCollision(player.x,player.y,player.width,player.height)){player.y=Math.floor((player.y+player.height)/BLOCK_SIZE)*BLOCK_SIZE-player.height;player.vy=0;player.onGround=true;}else{player.onGround=false;}}
else if(player.vy<0){if(checkCollision(player.x,player.y,player.width,player.height)){player.y=Math.ceil(player.y/BLOCK_SIZE)*BLOCK_SIZE;player.vy=0;}player.onGround=false;}
else{if(checkCollision(player.x,player.y+1,player.width,player.height)){player.onGround=true;}else{player.onGround=false;}}
}

function render(){ctx.fillStyle='#87CEEB';ctx.fillRect(0,0,canvas.width,canvas.height);
var startX=Math.max(0,Math.floor(camera.x/BLOCK_SIZE)-1),endX=Math.min(WORLD_WIDTH,Math.ceil((camera.x+canvas.width)/BLOCK_SIZE)+1),startY=Math.max(0,Math.floor(camera.y/BLOCK_SIZE)-1),endY=Math.min(WORLD_HEIGHT,Math.ceil((camera.y+canvas.height)/BLOCK_SIZE)+1);
for(var x=startX;x<endX;x++){for(var y=startY;y<endY;y++){drawBlock(x,y,world[x][y]);}}
drawPlayer();
}

function gameLoop(){updatePlayer();updateCamera();render();setTimeout(gameLoop,16);} // ~60fps

function isInReach(wx,wy){var px=player.x+player.width/2,py=player.y+player.height/2,bx=wx*BLOCK_SIZE+BLOCK_SIZE/2,by=wy*BLOCK_SIZE+BLOCK_SIZE/2;return Math.abs(px-bx)<BLOCK_SIZE*MAX_REACH && Math.abs(py-by)<BLOCK_SIZE*MAX_REACH;}

function handleTouch(x,y){var wx=Math.floor((x+camera.x)/BLOCK_SIZE),wy=Math.floor((y+camera.y)/BLOCK_SIZE);if(wx>=0 && wx<WORLD_WIDTH && wy>=0 && wy<WORLD_HEIGHT){if(isInReach(wx,wy)){if(mode==='mine'){if(world[wx][wy]!==BLOCKS.AIR){world[wx][wy]=BLOCKS.AIR;}}else{if(world[wx][wy]===BLOCKS.AIR){var pl=Math.floor(player.x/BLOCK_SIZE),pr=Math.floor((player.x+player.width-1)/BLOCK_SIZE),pt=Math.floor(player.y/BLOCK_SIZE),pb=Math.floor((player.y+player.height-1)/BLOCK_SIZE);var overlaps=(wx>=pl && wx<=pr && wy>=pt && wy<=pb);if(!overlaps){world[wx][wy]=selectedBlock;}}}}}}

var isTouching=false;
canvas.addEventListener('touchstart',function(e){e.preventDefault();isTouching=true;handleTouch(e.touches[0].clientX,e.touches[0].clientY);});
canvas.addEventListener('touchmove',function(e){e.preventDefault();if(isTouching){handleTouch(e.touches[0].clientX,e.touches[0].clientY);}});
canvas.addEventListener('touchend',function(e){e.preventDefault();isTouching=false;});

function addButtonEvents(id,key){var btn=document.getElementById(id);btn.addEventListener('touchstart',function(e){e.preventDefault();keys[key]=true;});btn.addEventListener('touchend',function(e){e.preventDefault();keys[key]=false;});}
addButtonEvents('leftBtn','left');addButtonEvents('rightBtn','right');addButtonEvents('jumpBtn','jump');

var modeBtn=document.getElementById('mode-indicator');
modeBtn.addEventListener('touchstart',function(e){e.preventDefault();mode=mode==='mine'?'place':'mine';this.textContent=mode==='mine'?'⛏ MINE':'⬜ PLACE';this.className=mode==='mine'?'mine-mode':'place-mode';});

function createInventory(){var invDiv=document.getElementById('inventory');for(var i=0;i<inventory.length;i++){var slot=document.createElement('div');slot.className='inv-slot';if(i===selectedSlot){slot.className+=' selected';}
var blockCanvas=document.createElement('canvas');blockCanvas.width=40;blockCanvas.height=40;var blockCtx=blockCanvas.getContext('2d');var bt=inventory[i];var colors=BLOCK_COLORS[bt];if(colors){blockCtx.fillStyle=colors[0];blockCtx.fillRect(0,0,40,40);if(bt===BLOCKS.GRASS){blockCtx.fillStyle=BLOCK_COLORS[BLOCKS.DIRT][0];blockCtx.fillRect(0,8,40,32);}blockCtx.fillStyle=colors[1];blockCtx.fillRect(0,36,40,4);blockCtx.fillRect(36,0,4,40);blockCtx.fillStyle='rgba(255,255,255,0.3)';blockCtx.fillRect(0,0,40,3);blockCtx.fillRect(0,0,3,40);}
slot.appendChild(blockCanvas);slot.setAttribute('data-index',i);slot.addEventListener('touchstart',function(e){e.preventDefault();var idx=parseInt(this.getAttribute('data-index'),10);selectedSlot=idx;selectedBlock=inventory[idx];var slots=invDiv.getElementsByClassName('inv-slot');for(var j=0;j<slots.length;j++){slots[j].className='inv-slot';}this.className='inv-slot selected';});invDiv.appendChild(slot);}}

window.addEventListener('resize',resizeCanvas);

initWorld();createInventory();selectedBlock=inventory[0];gameLoop();
})();
</script>
</body>
</html>
